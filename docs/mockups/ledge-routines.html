<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledge — Routines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;650&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Routines (spec docs/superpowers/specs/2026-11-23-routines-design.md, §3.7), drawn in the Desktop as it is on origin/main at
   756fd2a2: the IDE shell (activity bar, explorer, dock tabs, status bar, right chat), « À toi » as the page and the sidebar view,
   « Le point » as PointTurn in the chat. Tokens: packages/ui tokens.css as copied by the IDE planches (ledge-ide-tasks-history.html). */
:root[data-theme="dark"]{
  color-scheme:dark;
  --background:oklch(0.145 0 0);--foreground:oklch(0.985 0 0);--card:oklch(0.205 0 0);--muted:oklch(0.269 0 0);
  --muted-foreground:oklch(0.708 0 0);--primary:oklch(0.444 0.177 26.899);--border:#ffffff1a;--input:#ffffff26;
  --shell:#0d0d0d;--side:#141414;--pane:#111112;--page:#000;--hover:#ffffff10;--note:#a78bfa;--hl:#a78bfa26;
  --st-perm:#f87171;--st-ask:#fbbf24;--st-work:#60a5fa;--st-idle:#34d399;--st-off:#71717a;--coral:#ea6a58;--claude:#d97757;
  --tui-bg:#1c1a18;--tui-fg:#e7e2da;--tui-dim:#8b857c;--tui-line:#4a453f;--tui-sel:#2b2825;--tui-acc:#e8735a;--tui-ok:#7fc99a;--tui-warn:#e0b35a;--tui-bad:#e57373;--tui-key:#33302c;
  --phone:#0a0a0a;
}
:root[data-theme="light"]{
  color-scheme:light;
  --background:oklch(1 0 0);--foreground:oklch(0.145 0 0);--card:oklch(1 0 0);--muted:oklch(0.97 0 0);
  --muted-foreground:oklch(0.556 0 0);--primary:oklch(0.505 0.213 27.518);--border:oklch(0.922 0 0);--input:oklch(0.88 0 0);
  --shell:oklch(0.985 0 0);--side:oklch(0.975 0 0);--pane:#fff;--page:oklch(0.95 0 0);--hover:#0000000a;--note:#7c3aed;--hl:#7c3aed1f;
  --st-perm:#dc2626;--st-ask:#b45309;--st-work:#2563eb;--st-idle:#059669;--st-off:#a1a1aa;--coral:#cc5241;--claude:#c15f3c;
  --tui-bg:#faf8f4;--tui-fg:#2a2724;--tui-dim:#8a847b;--tui-line:#d6d0c6;--tui-sel:#efeae2;--tui-acc:#c8553d;--tui-ok:#2f8a55;--tui-warn:#a86f0c;--tui-bad:#c0392b;--tui-key:#e8e3da;
  --phone:#fff;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Geist','Segoe UI',system-ui,sans-serif;background:var(--page);color:var(--foreground);font-size:13px;line-height:18px}
button,select,input,textarea{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
code,.mono{font-family:'Geist Mono',ui-monospace,Consolas,monospace;font-size:11px}
.mut{color:var(--muted-foreground)}
header.bar{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;background:var(--shell);border-bottom:1px solid var(--border)}
header.bar h1{font-size:14px;font-weight:600;margin:0}
header.bar .sub{color:var(--muted-foreground);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--input);border-radius:7px;overflow:hidden}
.seg button{padding:3px 10px;font-size:12px;color:var(--muted-foreground)}
.seg button.on{background:var(--muted);color:var(--foreground)}
main{padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:18px;max-width:1600px;align-items:start}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card h2{font-size:12.5px;font-weight:600;margin:0;padding:10px 14px 0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h2 .n{font-family:'Geist Mono',monospace;font-size:11px;color:var(--muted-foreground)}
.card .why{padding:4px 14px 8px;color:var(--muted-foreground);font-size:12px}
.card .why b{color:var(--foreground);font-weight:500}
.card .keys{padding:0 14px 10px;font-size:11px;color:var(--muted-foreground)}
.tag{font-size:10.5px;border-radius:8px;padding:0 6px;border:1px solid}
.tag.new{color:var(--note);border-color:color-mix(in srgb,var(--note) 45%,transparent)}
.tag.q{color:var(--st-ask);border-color:color-mix(in srgb,var(--st-ask) 45%,transparent)}
.scene{border-top:1px solid var(--border);background:var(--page);padding:14px;display:flex;gap:14px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.cap{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:6px}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--st-off);display:inline-block}
.dot.perm{background:var(--st-perm)}.dot.ask{background:var(--st-ask)}.dot.work{background:var(--st-work)}.dot.idle{background:var(--st-idle)}
.btn{height:24px;padding:0 9px;border-radius:6px;border:1px solid var(--input);font-size:11.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0}
.btn.pri{background:var(--primary);border-color:transparent;color:#fff}
.btn.ghost{border-color:transparent;color:var(--muted-foreground)}
.btn.danger{color:var(--st-perm);border-color:color-mix(in srgb,var(--st-perm) 45%,transparent)}
.btn.dangerfill{background:var(--st-perm);border-color:transparent;color:#fff}
.btn.hov{background:var(--hover)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.icon{width:24px;padding:0;justify-content:center}
.pill{font-size:10.5px;border:1px solid var(--input);border-radius:8px;padding:0 6px;color:var(--muted-foreground);flex-shrink:0;white-space:nowrap;line-height:16px}
.pill.ask{color:var(--st-ask);border-color:color-mix(in srgb,var(--st-ask) 50%,transparent)}
.pill.bad{color:var(--st-perm);border-color:color-mix(in srgb,var(--st-perm) 50%,transparent)}
.pill.ok{color:var(--st-idle);border-color:color-mix(in srgb,var(--st-idle) 45%,transparent)}
.pill.late{color:var(--st-ask);border-style:dashed;border-color:color-mix(in srgb,var(--st-ask) 50%,transparent)}
.mk{width:14px;text-align:center;font-size:11px;flex-shrink:0}
.mk.ok{color:var(--st-idle)}.mk.bad{color:var(--st-perm)}.mk.ask{color:var(--st-ask);font-weight:600}
.clock{display:inline-flex;color:var(--muted-foreground);flex-shrink:0}
.newmark{font-size:10px;color:var(--note);border:1px dashed color-mix(in srgb,var(--note) 60%,transparent);border-radius:6px;padding:0 5px;white-space:nowrap}
.flag{outline:2px dashed color-mix(in srgb,var(--note) 70%,transparent);outline-offset:2px;border-radius:6px}

/* IDE frame (ide.css: 34 px title, 48 px activity, 248 px explorer, 300 px right, 24 px status). */
.ide{width:1280px;max-width:100%;height:720px;display:grid;grid-template-rows:34px 1fr 24px;background:var(--background);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.ide.short{height:560px}
.ide.tall{height:900px}
.ide .tb{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--side);border-bottom:1px solid var(--border);font-size:12px}
.ide .tb b{font-weight:600}
.ide .tb .search{margin:0 auto;width:420px;height:22px;border:1px solid var(--border);border-radius:6px;background:var(--background);color:var(--muted-foreground);font-size:11.5px;display:flex;align-items:center;padding:0 9px}
.ide .body{display:grid;grid-template-columns:48px 248px 1fr 300px;min-height:0}
.ide .body.noside{grid-template-columns:48px 1fr 300px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;background:var(--side);border-right:1px solid var(--border)}
.act span{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:7px;color:var(--muted-foreground)}
.act span.on{color:var(--foreground);background:var(--muted)}
.act .grow{flex:1;height:auto}
.act .badge{position:absolute;top:2px;right:1px;min-width:15px;height:15px;padding:0 3px;display:grid;place-items:center;border-radius:8px;background:var(--st-perm);color:#fff;font-size:10px;font-weight:600}
.act .badge.amber{background:var(--st-ask)}
.exp{background:var(--side);border-right:1px solid var(--border);padding:8px 6px;display:flex;flex-direction:column;gap:2px;font-size:12.5px;min-width:0}
.exp .h{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);padding:2px 6px 6px}
.srow{display:flex;align-items:center;gap:7px;height:24px;padding:0 6px 0 18px;border-radius:5px;min-width:0}
.srow.proj{padding-left:6px;font-weight:600}
.srow.sel{background:var(--hover)}
.srow .nm{white-space:nowrap}
.srow .br{margin-left:auto;font-family:'Geist Mono',monospace;font-size:11px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edit{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--background)}
.tabs{display:flex;height:30px;background:var(--side);border-bottom:1px solid var(--border);flex-shrink:0}
.tabs span{display:flex;align-items:center;gap:7px;padding:0 12px;font-size:12px;color:var(--muted-foreground);border-right:1px solid var(--border);white-space:nowrap}
.tabs span.on{background:var(--pane);color:var(--foreground);box-shadow:inset 0 2px 0 var(--coral)}
.tabs span .x{font-size:11px;opacity:.6}
.pane{flex:1;min-height:0;overflow:hidden;background:var(--pane)}
.right{background:var(--side);border-left:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.right .ch{height:56px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--border)}
.right .ch .m{width:28px;height:28px;border-radius:8px;background:radial-gradient(circle at 50% 40%,var(--coral),color-mix(in srgb,var(--coral) 40%,var(--side)))}
.right .ch b{font-size:14px;font-weight:650}.right .ch b i{color:var(--coral);font-style:normal}
.right .ch small{display:block;font-size:11px;color:var(--muted-foreground)}
.right .rt{display:flex;height:30px;border-bottom:1px solid var(--border);padding:0 6px}
.right .rt span{padding:0 8px;font-size:12px;color:var(--muted-foreground);display:flex;align-items:center;position:relative}
.right .rt span.on{color:var(--foreground)}
.right .rt span.on::after{content:"";position:absolute;left:6px;right:6px;bottom:-1px;height:2px;background:var(--foreground)}
.right .msgs{flex:1;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.sb{display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--side);border-top:1px solid var(--border);font-size:11.5px;color:var(--muted-foreground);white-space:nowrap}
.sb .sp{flex:1}
.sb .it{display:inline-flex;align-items:center;gap:5px}

/* The Routines page (new): a tab of the editing area, the same page frame as « À toi » (atoiPage). */
.rpage{height:100%;overflow:hidden;padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px;max-width:980px}
.rpage.free{height:auto;background:var(--pane);border:1px solid var(--border);border-radius:6px;width:100%}
.rtop{display:flex;align-items:flex-start;gap:12px}
.rtop h3{margin:0;font-size:15px;font-weight:600}
.rtop .psub{display:block;color:var(--muted-foreground);font-size:12px;margin-top:2px}
.tz{font-size:11.5px;color:var(--muted-foreground)}
.rlist{border:1px solid var(--border);border-radius:9px;overflow:hidden}
.rhead{display:grid;grid-template-columns:minmax(0,1fr) 84px auto;gap:14px;padding:6px 12px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);border-bottom:1px solid var(--border);background:var(--side)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 84px auto;gap:4px 14px;padding:9px 12px;align-items:start;border-top:1px solid var(--border);font-size:12.5px;position:relative}
.rrow:first-of-type{border-top:0}
.rhead+.rrow{border-top:0}
.rrow.hov{background:var(--hover)}
.rrow.pending{background:color-mix(in srgb,var(--st-ask) 7%,transparent);box-shadow:inset 3px 0 0 var(--st-ask)}
.rrow.failed{box-shadow:inset 3px 0 0 var(--st-perm)}
.rrow.paused>.c:not(.acts){opacity:.55}
.rrow .c{min-width:0;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.rrow .c.main{align-items:stretch}
.rrow .l.last{flex-wrap:wrap;white-space:normal;row-gap:2px}
.rrow .l.last .cut{overflow:visible;flex-shrink:0;white-space:nowrap}
.rrow .c b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .c small{font-size:11px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .who{display:flex;align-items:center;gap:6px;min-width:0}
.rrow .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .line1{display:flex;align-items:center;gap:6px;min-width:0}
.rrow .acts{display:flex;gap:5px;align-items:center;justify-content:flex-end;flex-direction:row;padding-top:1px}
.rrow .c.main{gap:3px}
.rrow .l{display:flex;align-items:center;gap:7px;min-width:0;font-size:12px;white-space:nowrap}
.rrow .l>*{flex-shrink:0}
.rrow .l .cut{flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rrow .nx{font-size:13px;font-weight:500}
.rrow .nx+small{margin-top:-1px}
.rrow .sub2{grid-column:1/-1;margin:-2px 0 0;font-size:11.5px;color:var(--muted-foreground);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rrow .sub2 .prompt{flex:1 1 300px;min-width:0;font-family:'Geist Mono',monospace;font-size:11px;background:var(--side);border:1px solid var(--border);border-radius:6px;padding:5px 8px;color:var(--foreground);white-space:normal;overflow-wrap:anywhere}
.reason{color:var(--st-perm)}
.times{font-family:'Geist Mono',monospace;font-size:11.5px}
.menu{position:absolute;right:12px;top:38px;z-index:5;width:200px;padding:4px;border:1px solid var(--border);border-radius:8px;background:var(--card);box-shadow:0 6px 20px #0006;display:flex;flex-direction:column}
.menu span{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:5px;font-size:12.5px}
.menu span.hov{background:var(--hover)}
.menu span.d{color:var(--st-perm)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 2px}
.menu kbd{margin-left:auto;font:10.5px 'Geist Mono',monospace;color:var(--muted-foreground)}
.confirm{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:7px;background:color-mix(in srgb,var(--st-perm) 6%,transparent);border:1px solid color-mix(in srgb,var(--st-perm) 40%,var(--border))}
.confirm strong{font-size:12.5px;font-weight:600}
.confirm .go{display:flex;gap:6px}
.spin{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--muted-foreground);border-top-color:transparent;display:inline-block;flex-shrink:0}
.toast{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);box-shadow:0 6px 20px #0005;font-size:12.5px;width:max-content;max-width:100%}
.banner{padding:7px 10px;border-radius:7px;border:1px solid var(--input);background:var(--side);font-size:12px;color:var(--muted-foreground);display:flex;gap:8px;align-items:center}
.empty{padding:40px 20px;text-align:center;color:var(--muted-foreground);font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:10px;border:1px dashed var(--input);border-radius:9px}
.empty h4{margin:0;color:var(--foreground);font-size:14px;font-weight:600}
.empty code{background:var(--side);border:1px solid var(--border);border-radius:5px;padding:2px 6px}

/* The form, in place of the list (« ‹ Routines »). */
.form{display:flex;flex-direction:column;gap:14px;max-width:680px}
.fld{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;align-items:start}
.fld>label{font-size:12px;color:var(--muted-foreground);padding-top:5px}
.inp{height:28px;border:1px solid var(--input);border-radius:6px;padding:0 9px;background:var(--background);display:flex;align-items:center;gap:7px;font-size:12.5px;min-width:0}
.inp.err{border-color:var(--st-perm)}
.inp.foc{box-shadow:0 0 0 2px color-mix(in srgb,var(--foreground) 25%,transparent)}
.inp.sel::after{content:"▾";margin-left:auto;font-size:9px;color:var(--muted-foreground)}
.inp .ph{color:var(--muted-foreground)}
.hint{font-size:11.5px;color:var(--muted-foreground)}
.hint.err{color:var(--st-perm)}
.radios{display:flex;flex-direction:column;gap:6px}
.radio{display:flex;gap:8px;align-items:flex-start;font-size:12.5px}
.radio i{width:14px;height:14px;border-radius:50%;border:1px solid var(--input);flex-shrink:0;margin-top:2px;display:grid;place-items:center}
.radio i.on::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--foreground)}
.radio small{display:block;color:var(--muted-foreground);font-size:11.5px}
.sub{border-left:2px solid var(--border);margin-left:6px;padding-left:14px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{height:26px;display:inline-flex;align-items:center;gap:6px;padding:0 6px 0 9px;border:1px solid var(--input);border-radius:6px;font:12px 'Geist Mono',monospace;background:var(--background)}
.chip .x{color:var(--muted-foreground);font-family:'Geist',sans-serif}
.days{display:inline-flex;align-self:flex-start;border:1px solid var(--input);border-radius:7px;overflow:hidden}
.days span{width:32px;height:26px;display:grid;place-items:center;font-size:12px;color:var(--muted-foreground);border-left:1px solid var(--input)}
.days span:first-child{border-left:0}
.days span.on{background:var(--muted);color:var(--foreground);font-weight:600}
.ta{border:1px solid var(--input);border-radius:6px;background:var(--background);padding:8px 10px;font:12px/18px 'Geist Mono',monospace;min-height:78px;white-space:pre-wrap;overflow-wrap:anywhere}
.ta .v{color:var(--note);background:var(--hl);border-radius:3px;padding:0 2px}
.vars{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--muted-foreground)}
.vars button{font:11px 'Geist Mono',monospace;border:1px solid var(--input);border-radius:5px;padding:1px 6px;color:var(--note)}
.preview{font-size:11.5px;color:var(--muted-foreground);border:1px dashed var(--input);border-radius:6px;padding:6px 9px}
.preview b{color:var(--foreground);font-weight:500}
.fgo{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--border);padding-top:12px}

/* « À toi »: the page block and the sidebar view of the IDE. */
.blk{border:1px solid var(--border);border-radius:9px;background:var(--pane)}
.blk-h{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.blk-h b{font-weight:600}.blk-h .sp{flex:1}.blk-h .psub{font-size:11.5px;color:var(--muted-foreground)}
.blk-b{padding:9px 12px;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.line{display:flex;align-items:center;gap:8px;min-width:0}
.line .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line .grow.wrap{white-space:normal}
.unfold{margin:0 0 2px 22px;font:11px/17px 'Geist Mono',monospace;background:var(--side);border:1px solid var(--border);border-radius:6px;padding:6px 9px;white-space:pre-wrap;overflow-wrap:anywhere}
.atoipage{width:100%;max-width:820px;background:var(--pane);border:1px solid var(--border);border-radius:6px;padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px}
.atoipage h3{margin:0;font-size:15px;font-weight:600}
.side{width:248px;background:var(--side);border:1px solid var(--border);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.side .h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);padding:0 2px}
.side .row{display:flex;gap:7px;align-items:flex-start;font-size:12px;padding:6px 7px;border-radius:7px;background:var(--hover)}
.side .row small{display:block;color:var(--muted-foreground);font-size:11px}
.side .row .acts{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}

/* The island's « À toi » (overlay, 420 px, always dark like the island). */
.island{width:420px;background:#0b0b0c;color:#f5f5f5;border:1px solid #ffffff1f;border-radius:18px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;--muted-foreground:#a1a1aa;--input:#ffffff2e;--border:#ffffff1a;--hover:#ffffff12}
.island .ih{display:flex;align-items:center;gap:8px;font-size:11px;color:#a1a1aa}
.island .ih b{color:#f5f5f5;font-size:12.5px}
.island .it{border:1px solid #ffffff1a;border-radius:11px;padding:9px 11px;display:flex;flex-direction:column;gap:6px;background:#161618}
.island .it .who{display:flex;gap:7px;align-items:center;font-size:11.5px;color:#a1a1aa}
.island .it .who b{color:#f5f5f5}
.island .it .acts{display:flex;gap:6px}
.island .btn{border-color:#ffffff2e}
.island .btn.pri{background:oklch(0.444 0.177 26.899)}

/* PointTurn (packages/ui chat/PointTurn.tsx), in the 300 px chat. */
.pt{background:var(--card);border:1px solid color-mix(in srgb,var(--coral) 40%,var(--border));border-radius:9px;padding:8px 10px;font-size:12px;line-height:17px}
.pt .ph{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted-foreground);margin-bottom:6px}
.pt .ph .m{width:18px;height:18px;border-radius:5px;background:radial-gradient(circle at 50% 40%,var(--coral),color-mix(in srgb,var(--coral) 40%,var(--card)))}
.pt .ph b{color:var(--foreground);font-weight:600}
.pt h5{margin:8px 0 4px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;color:var(--muted-foreground);display:flex;gap:6px}
.pt .pr{display:grid;grid-template-columns:12px minmax(0,1fr);gap:2px 7px;padding:5px 0;border-top:1px dashed var(--border)}
.pt h5+.pr{border-top:0}
.pt .pr>.dot{margin-top:5px}
.pt .pr small{display:block;font-size:11px;color:var(--muted-foreground)}
.pt .pr .acts{grid-column:2;display:flex;gap:5px;margin-top:3px;flex-wrap:wrap}
.pt .btn{height:22px;padding:0 8px;font-size:11.5px}

/* Phone (390 px), the PWA's frame: header, content, the five tabs. */
.phone{width:360px;height:720px;border-radius:34px;border:1px solid var(--border);background:var(--phone);overflow:hidden;display:flex;flex-direction:column;font-size:14px;line-height:20px;flex-shrink:0;box-shadow:0 0 0 6px color-mix(in srgb,var(--foreground) 6%,transparent)}
.phone .stat{height:30px;display:flex;justify-content:space-between;padding:8px 22px 0;font-size:12px;font-weight:600}
.phone .hd{display:flex;align-items:center;gap:10px;padding:8px 16px 10px}
.phone .hd h3{margin:0;font-size:20px;font-weight:650;flex:1}
.phone .hd .back{font-size:14px;color:var(--muted-foreground);display:flex;align-items:center;gap:4px}
.phone .cnt{flex:1;overflow:hidden;padding:0 12px;display:flex;flex-direction:column;gap:10px}
.phone .tabbar{height:58px;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);font-size:10.5px;color:var(--muted-foreground)}
.phone .tabbar span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.phone .tabbar span.on{color:var(--foreground);font-weight:600}
.phone .tabbar i{width:20px;height:20px;border-radius:6px;border:1.6px solid currentColor;display:block;opacity:.8}
.phone .tabbar .b{position:absolute;top:6px;left:calc(50% + 4px);min-width:16px;height:16px;border-radius:8px;background:var(--st-perm);color:#fff;font-size:10px;display:grid;place-items:center;font-style:normal;padding:0 4px}
.pcard{border:1px solid var(--border);border-radius:14px;background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pcard.pending{border-color:color-mix(in srgb,var(--st-ask) 55%,var(--border))}
.pcard.failed{border-color:color-mix(in srgb,var(--st-perm) 55%,var(--border))}
.pcard .top{display:flex;align-items:center;gap:9px}
.pcard .top b{font-size:15px;font-weight:600}
.pcard .meta{font-size:13px;color:var(--muted-foreground)}
.pcard .acts{display:flex;gap:8px}
.pcard .acts .btn{height:40px;font-size:14px;flex:1;justify-content:center;border-radius:10px}
.pcard .acts .btn.icon{flex:0 0 40px;width:40px}
.prow{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:14px;background:var(--card);padding:12px 14px;font-size:14px}
.prow small{display:block;font-size:12.5px;color:var(--muted-foreground)}
.bot{width:30px;height:30px;flex-shrink:0;position:relative}
.bot svg{width:30px;height:30px}
.bot .s{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--card)}
.sheet{position:relative}

/* ledge tui: Ink frame, the roles screen's patterns (ledge-openrig-roles-tui.html). */
.tui{width:660px;background:var(--tui-bg);color:var(--tui-fg);font:13px/18px 'Geist Mono',ui-monospace,Consolas,monospace;border-radius:8px;border:1px solid var(--border);padding:10px 14px 12px;white-space:pre;flex-shrink:0}
.tui .acc{color:var(--tui-acc)}.tui .dim{color:var(--tui-dim)}.tui .ok{color:var(--tui-ok)}.tui .warn{color:var(--tui-warn)}.tui .bad{color:var(--tui-bad)}.tui b{font-weight:600}
.tui .ln{color:var(--tui-line)}
.tui .box{position:relative;border:1px solid var(--tui-line);border-radius:6px;padding:10px 8px 8px;margin:10px 0 8px;min-height:240px}
.tui .box>.lg{position:absolute;top:-10px;left:10px;background:var(--tui-bg);padding:0 6px;font-weight:600}
.tui .sel{background:var(--tui-sel);display:inline-block;width:100%;box-shadow:-4px 0 0 var(--tui-acc)}
.tui .k{background:var(--tui-key);padding:1px 6px;border-radius:3px;color:var(--tui-fg)}


/* v2: the Routines sidebar view and a routine's page. */
.rside{gap:0;position:relative}
.rside .hb{display:grid;place-items:center;width:22px;height:22px;border-radius:5px;color:var(--muted-foreground)}
.rsrow{position:relative;display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:1px 7px;padding:5px 6px;border-radius:5px;font-size:12.5px;align-items:center}
.rsrow.sel{background:var(--muted)}.rsrow.hov{background:var(--hover)}
.rsrow>b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsrow .nx{font:11px 'Geist Mono',monospace;color:var(--muted-foreground);white-space:nowrap}
.rsrow small{grid-column:2/4;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted-foreground);min-width:0}
.rsrow small span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsrow .x3{grid-column:2/4;display:flex;align-items:center;gap:6px;font-size:11px;min-width:0;white-space:nowrap;overflow:hidden}
.rsrow .x3.reason{display:block;text-overflow:ellipsis}
.rsrow .qa{display:flex;gap:1px;margin:-3px -3px -3px 0}
.rsrow .qa .btn{width:22px;height:22px}
.rs-grp{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);padding:10px 6px 4px}
.rs-empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--muted-foreground);font-size:12px;padding:26px 12px}
.rs-empty b{color:var(--foreground);font-size:13px}
.rs-foot{margin-top:auto;padding:8px 6px 2px;font-size:11px;color:var(--muted-foreground)}
.exp.rside{height:auto;min-height:420px;width:248px;border:1px solid var(--border);border-radius:6px}
.ide .exp.rside{border:0;border-right:1px solid var(--border);border-radius:0;min-height:0}
.rp2{position:relative;padding:16px 22px 0;display:flex;flex-direction:column;gap:14px;max-width:760px}
.rhd{position:relative;display:flex;align-items:center;gap:9px}
.rhd h3{margin:0;font-size:17px;font-weight:650}
.wakes{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;margin-top:-6px}
.wakes .btn{margin-left:2px}
.sect{border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.sect h4{margin:0;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);font-weight:500}
.runs{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px}
.runs .lbl{font-size:11.5px;color:var(--muted-foreground);margin-bottom:5px}
.runs ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12px}
.runs li{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.runs .mono{font-size:11.5px}
.bn{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:8px;font-size:12.5px}
.bn p{margin:3px 0 0;color:var(--muted-foreground);font-size:12px}
.bn .go{display:flex;gap:6px;flex-shrink:0}
.bn.ask{border:1px solid color-mix(in srgb,var(--st-ask) 55%,var(--border));background:color-mix(in srgb,var(--st-ask) 8%,transparent)}
.bn.bad{border:1px solid color-mix(in srgb,var(--st-perm) 50%,var(--border));background:color-mix(in srgb,var(--st-perm) 7%,transparent)}
.dirtybar{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;margin:0 -22px;padding:10px 22px;border-top:1px solid var(--border);background:var(--pane);font-size:12.5px}
.paneframe{width:684px;max-width:100%;background:var(--pane);border:1px solid var(--border);border-radius:6px;padding-bottom:16px}
.pane .rp2{height:100%;overflow:hidden}

/* Ajout: recurring / once, the 3-run preview, one-shot groups. */
.tag.add{color:var(--st-idle);border-color:color-mix(in srgb,var(--st-idle) 50%,transparent);font-weight:600}
.card.addc{border-color:color-mix(in srgb,var(--st-idle) 45%,var(--border))}
.seg2{display:inline-flex;align-self:flex-start;justify-self:start;border:1px solid var(--input);border-radius:7px;overflow:hidden}
.seg2 span{padding:4px 12px;font-size:12px;color:var(--muted-foreground);border-left:1px solid var(--input)}
.seg2 span:first-child{border-left:0}
.seg2 span.on{background:var(--muted);color:var(--foreground);font-weight:500}
.prev3{border:1px solid var(--border);border-radius:7px;padding:8px 10px;background:var(--side);display:flex;flex-direction:column;gap:5px}
.prev3.shift{border-color:color-mix(in srgb,var(--st-ask) 60%,var(--border));background:color-mix(in srgb,var(--st-ask) 7%,var(--side))}
.prev3 .lbl{font-size:11.5px;color:var(--muted-foreground)}
.prev3 ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.prev3 li{display:flex;gap:10px}
.prev3.shift .hint{color:var(--st-ask)}
.rs-prop{grid-column:1/-1;font-size:10.5px;color:var(--muted-foreground);padding:4px 6px 2px 27px;border-left:2px solid color-mix(in srgb,var(--st-ask) 60%,transparent);margin:2px 0 0 9px}
.rsrow.dimrow{opacity:.6}
.glist{margin-left:22px;border-left:2px solid var(--border);padding-left:10px;display:flex;flex-direction:column;gap:4px}
.glinks a{color:var(--note);cursor:pointer}
section.fiche{grid-column:1/-1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;font-size:12.5px}
section.fiche h2{font-size:13px;margin:0 0 6px}
section.fiche table{border-collapse:collapse;width:100%;font-size:12px}
section.fiche td,section.fiche th{border-top:1px solid var(--border);padding:5px 8px;text-align:left;vertical-align:top}
section.fiche th{color:var(--muted-foreground);font-weight:500}
section.fiche ol{margin:6px 0 0;padding-left:20px}section.fiche li{margin:6px 0}
@media (max-width:640px){main{grid-template-columns:1fr;padding:12px}}
</style>
</head>

/* A routine's page: header (name, state, actions), the session it wakes, its runs, then its configuration. */
const rpage = (r, o={}) => { const x = t(), runs = RUNS();
  const stPill = r.state==='pending' ? `<span class="pill ask">${x.pending}</span>` : r.state==='paused' ? `<span class="pill">${x.stPaused}</span>` : `<span class="pill ok">${x.stEnabled}</span>`;
  const failed = r.last && r.last[1]==='failed';
  const actions = r.state==='pending' ? `<button class="btn icon ghost ${o.menu?'hov':''}" title="${x.more}">${I.dots(14)}</button>`
    : `<button class="btn ${failed?'pri':''}" ${o.off?'disabled':''}>${I.play(12)}${failed?x.retry:x.runNow}</button><button class="btn" ${o.off?'disabled':''}>${r.state==='paused'?I.play(12)+x.resume:I.pause(12)+x.pause}</button><button class="btn icon ghost ${o.menu?'hov':''}" title="${x.more}">${I.dots(14)}</button>`;
  const banner = o.banner || '';
  const nextList = o.nextList ? o.nextList.map(([d,h]) => `<li><span class="mono">${h}</span><span class="mut">${d}</span></li>`).join('') : r.state==='pending' ? `<li class="mut">${x.noneUntil}</li>` : r.state==='paused' ? `<li class="mut">${x.noneWhilePaused}</li>` : runs.next.map(([d,h]) => `<li><span class="mono">${h}</span><span class="mut">${d}</span></li>`).join('');
  const past = o.pastList || (r.state==='pending' ? [] : runs.past);
  const pastList = past.length ? past.map(([d,h,out,late,why]) => `<li>${out==='failed'?'<span class="mk bad">!</span>':'<span class="mk ok">✓</span>'}<span class="mono">${h}</span><span class="mut">${d}</span><span>${x.out[out]}</span>${late?`<span class="pill late">${x.late}</span><span class="mut">${x.lateLong(h, late)}</span>`:''}${why?`<span class="reason">${why}</span>`:''}</li>`).join('') : `<li class="mut">${x.never}</li>`;
  return `<div class="rp2">
    <div class="rhd">${I.alarm(18)}<h3>${r.name}</h3>${stPill}<span style="flex:1"></span>${actions}${o.menu?`<div class="menu" style="top:34px;right:0"><span class="hov">${I.open(14)}${x.openSession}</span><hr><span class="d">${I.trash(14)}${x.del}</span></div>`:''}</div>
    <div class="wakes">${x.wakes}${logo(r.tool,12)}<b>${r.s}</b><span class="dot ${r.st==='working'?'work':r.st==='idle'?'idle':''}"></span><span class="mut">${x.st[r.st==='gone'?'off':r.st]}</span><span class="mut">${x.inDir}</span><span class="mono">${r.dir}</span><button class="btn ghost">${I.open(12)}${x.openSession}</button></div>
    ${banner}
    ${o.noRuns?'':`<section class="sect"><h4>${x.runs}</h4><div class="runs"><div><div class="lbl">${x.nextRuns}</div><ul>${nextList}</ul></div><div><div class="lbl">${x.pastRuns}</div><ul>${pastList}</ul></div></div></section>`}
    <section class="sect"><h4>${x.config}</h4><div class="form">${formFields(o.form||{})}</div></section>
    ${o.dirty?`<div class="dirtybar"><span class="dot ask"></span><span>${x.dirty}</span><span style="flex:1"></span><button class="btn">${x.discard}</button><button class="btn pri">${x.save}</button></div>`:''}
    ${o.footer||''}
  </div>`;
};
const newPage = (o={}) => { const x = t();
  return `<div class="rp2"><div class="rhd">${I.alarm(18)}<h3>${x.newTitle}</h3><span style="flex:1"></span></div><span class="mut" style="font-size:12px;margin-top:-8px">${x.sub} <span class="tz">(${x.tz})</span></span>
    <section class="sect"><h4>${x.config}</h4><div class="form">${formFields({blank:true, newSession:o.newSession, errs:o.errs, errDir:o.errDir})}</div></section>
    <div class="dirtybar"><span style="flex:1"></span><button class="btn">${x.cancel}</button><button class="btn pri">${x.create}</button></div></div>`;
};

    why:'Un bloc <b>Routines</b> (« à activer, ou qui n’ont pas pu partir »), <b>caché quand il est vide</b> comme Décisions et Rigs, placé après Décisions : ce qui se décide d’abord. Deux lignes possibles, dans le style des lignes voisines. <b>Demande d’activation</b> : « ? » ambre, le texte de la spec (« Iris veut programmer « point-hebdo » : 17:00 (ven), dans ~/assistant »), « Voir le prompt » qui le déplie dessous, <b>Activer</b> / <b>Refuser</b>. <b>Échec</b> : « ! » rouge, « La routine veille (Nova) n’a pas pu partir : dossier introuvable : ~/veille », <b>Relancer</b> / <b>Voir</b> (Voir = la page de cette routine, comme un clic dans la barre latérale Routines). Activer, Refuser, Relancer réglés : la ligne part. L’échec part aussi au tir réussi suivant.',
    keys:'atoiPage.routines · atoiPage.routinesSub · atoi.routine.ask(who,name,times,days,dir) · atoi.routine.failed(name,who,why) · routines.activate/.refuse/.retry/.seePrompt (partagés)',
    scene: `<div class="atoipage"><div style="display:flex;gap:12px"><div style="flex:1"><h3>${x.atoi}</h3><span class="mut" style="font-size:12px">${x.atoiSub}</span></div></div>
      <div class="blk"><div class="blk-h"><span class="dot perm"></span><b>${x.requests}</b><span class="psub">1</span></div><div class="blk-b"><div class="line"><span class="dot perm"></span><b>Lu</b><span class="grow mut">${x.allowCommand} · <code>pnpm test</code></span><button class="btn pri">${x.allow}</button><button class="btn">${x.deny}</button></div></div></div>
      <div class="blk"><div class="blk-h"><span class="mk ask">?</span><b>${x.decisions}</b><span class="psub">1</span></div><div class="blk-b"><div class="line"><span class="mk ask">?</span><span class="grow"><b>Iris</b> ${L==='fr'?'Répondre à Marc sur le devis TOPdesk maintenant ou après la réunion ?':'Answer Marc about the TOPdesk quote now or after the meeting?'}</span><button class="btn pri">${L==='fr'?'Répondre':'Answer'}</button></div></div></div>
      <div class="blk" style="border-color:color-mix(in srgb,var(--note) 55%,var(--border))"><div class="blk-h"><span class="mut" style="display:inline-flex">${I.alarm(14)}</span><b>${x.blkRoutines}</b><span class="psub">2 · ${x.blkRoutinesSub}</span><span class="sp"></span><span class="newmark">${L==='fr'?'nouveau':'new'}</span></div><div class="blk-b">${askLine(true)}${failLine}</div></div>
      <div class="blk"><div class="blk-h"><span class="dot idle"></span><b>${x.finished}</b><span class="psub">1</span></div><div class="blk-b"><div class="line"><span class="dot idle"></span><b>Iris</b><span class="grow mut">${L==='fr'?'Briefing de 08:00 écrit : journal/2026-11-23.md, 3 décisions.':'08:00 briefing written: journal/2026-11-23.md, 3 decisions.'}</span><button class="btn">${L==='fr'?'Ouvrir':'Open'}</button></div></div></div></div>`});
  C.push({tag:'new', title:'« À toi », la barre latérale de l’IDE',
    why:'La vue « À toi » de la barre latérale (248 px) reprend les deux lignes en format court : qui, puis le texte sur deux lignes au plus, puis les boutons dessous. La demande garde Activer / Refuser (« Voir » ouvre la page de la routine, où le prompt se lit dans la configuration). La pastille ambre de l’entrée « À toi » de la barre d’activité les compte comme les autres décisions ; un échec compte en rouge.',
    keys:'(mêmes textes que la page)',
    scene: `<div class="side"><span class="h">${x.atoi}</span>
      <div class="row"><span class="mk ask">?</span><div><b>Iris</b> · ${x.pRoutine.toLowerCase()}<small>${L==='fr'?'veut programmer « point-hebdo » : 17:00 (ven), dans ~/assistant':'wants to schedule “point-hebdo”: 17:00 (Fri), in ~/assistant'}</small><div class="acts"><button class="btn pri">${x.activate}</button><button class="btn">${x.refuse}</button><button class="btn ghost">${x.see}</button></div></div></div>
      <div class="row"><span class="mk bad">!</span><div><b>Nova</b> · ${x.pRoutine.toLowerCase()}<small>${L==='fr'?'veille n’a pas pu partir : dossier introuvable : ~/veille':'veille could not run: folder not found: ~/veille'}</small><div class="acts"><button class="btn pri">${x.retry}</button><button class="btn ghost">${x.see}</button></div></div></div></div>`});
  C.push({tag:'new', title:'« À toi », l’île',
    why:'L’île (toujours sombre) montre les mêmes deux items dans ses cartes habituelles : qui et « routine » en tête, le texte, puis les boutons. Activer, Refuser et Relancer agissent depuis l’île ; « Voir » ouvre Ledge Desktop sur la page de la routine (comme « Voir » d’une décision ouvre « À toi »). Le prompt n’est pas déplié dans l’île : trop long pour elle ; « Voir » le montre.',
    keys:'overlay : atoi.routine.ask · .failed · .activate · .refuse · .retry · .see (nouveaux, catalogue de l’île)',
    scene: `<div class="island"><div class="ih"><b>Ledge</b><span>· ${x.atoi} · 2</span></div>
      <div class="it"><div class="who"><span class="mk ask">?</span><b>Iris</b><span>· ${x.pRoutine.toLowerCase()} · 02:10</span></div><span>${L==='fr'?'Iris veut programmer « point-hebdo » : 17:00 (ven), dans ~/assistant':'Iris wants to schedule “point-hebdo”: 17:00 (Fri), in ~/assistant'}</span><div class="acts"><button class="btn pri">${x.activate}</button><button class="btn">${x.refuse}</button><button class="btn ghost">${x.see}</button></div></div>
      <div class="it"><div class="who"><span class="mk bad">!</span><b>Nova</b><span>· ${x.pRoutine.toLowerCase()} · 18:00</span></div><span>${x.failLine('veille','Nova', x.failNoDir)}</span><div class="acts"><button class="btn pri">${x.retry}</button><button class="btn ghost">${x.see}</button></div></div></div>`});
  return C;
}

function pointCard(){
  const x = t();
  const pr = (dot, whoTxt, txt, sub, btns='') => `<div class="pr"><span class="dot ${dot}"></span><div><b>${whoTxt}</b> ${txt}${sub?`<small>${sub}</small>`:''}</div>${btns?`<div class="acts">${btns}</div>`:''}</div>`;
  const brief = x.ptLine('briefing','13:30');
  return {tag:'new', title:'« Le point » : la ligne d’une routine', wide:false,
    why:'Une ligne par tir, dans les groupes existants de PointTurn, avec le point de la tonalité habituelle. <b>En cours</b> (point bleu) tant que la session y travaille : « <b>Iris</b> briefing de 13:30 », sous-ligne « routine · depuis 4 min ». <b>Terminé</b> (point vert) quand elle redevient libre, avec l’heure comme les autres lignes terminées. <b>En retard</b> : « briefing de 08:00, lancé à 08:42 au réveil ». Bouton : <b>Voir</b> (la session). <b>Échec</b> : dans « À toi » du point, avec Relancer. Aucune pastille « À toi » pour un tir normal.',
    keys:'operator/point.ts L.routine(name,slot) · L.routineLate(name,slot,at) · L.routineFailed(name) · sous-ligne « routine » (nouveaux, FR/EN)',
    scene: `<div style="width:300px;background:var(--side);border:1px solid var(--border);border-radius:6px;padding:10px"><div class="pt"><div class="ph"><span class="m"></span><b>Ledge</b><span>${x.pointBy}</span><span style="flex:1"></span><span class="mono">13:34</span></div>
      <p style="margin:0">${x.ptLead}</p>
      <h5>${x.groups.atoi} <span class="mono">1</span></h5>${pr('perm','Nova', x.ptFail('veille'), x.failNoDir, `<button class="btn pri">${x.retry}</button><button class="btn ghost">${x.ptSee}</button>`)}
      <h5>${x.groups.ongoing} <span class="mono">1</span></h5>${pr('work','Iris', brief, x.ptSince(4), `<button class="btn ghost">${x.ptSee}</button>`)}
      <h5>${x.groups.done} <span class="mono">2</span></h5>${pr('idle','Iris', x.ptLate('briefing','08:00','08:42'), `${x.ptSub} · 08:51`)}${pr('idle','Otto', x.ptLine('revue-prs','09:00'), `${x.ptSub} · 09:12`)}
    </div></div>`};
}

function phoneCards(){
  const x = t(), rs = R();
  const stat = `<div class="stat"><span>13:02</span><span>●●● 5G</span></div>`;
  const tabbar = (on, badge) => `<div class="tabbar">${x.tabs.map((n,i)=>`<span class="${i===on?'on':''}"><i></i>${n}${i===0&&badge?`<em class="b">${badge}</em>`:''}</span>`).join('')}</div>`;
  const pc = (r) => { const cls = r.state==='pending'?'pending':r.last&&r.last[1]==='failed'?'failed':'';
    const st = r.st==='working'?'work':r.st==='idle'?'idle':'off';
    const lastTxt = r.state==='pending' ? `<span class="pill ask">${x.pending}</span>` : r.last ? `${r.last[1]==='failed'?'<span class="mk bad">!</span>':'<span class="mk ok">✓</span>'} ${x.lastAt(r.last[0], x.out[r.last[1]])}${r.late?` <span class="pill late">${x.late}</span>`:''}` : x.never;
    const nextTxt = r.state==='paused' ? `<span class="pill">${x.paused}</span>` : r.state==='pending' ? '' : x.pNext(`${r.next[0]} ${r.next[1]}`);
    const actsH = r.state==='pending' ? `<button class="btn">${x.pPendingSee}</button>` : `<button class="btn">${I.play(14)}${r.last&&r.last[1]==='failed'?x.retry:x.runNow}</button><button class="btn">${r.state==='paused'?x.resume:x.pause}</button>`;
    return `<div class="pcard ${cls}"><div class="top">${bot(r.tool==='codex'?'#9ca3af':'#e8735a', st)}<div style="flex:1;min-width:0"><b>${r.name}</b><div class="meta">${r.s} · ${r.times.join(', ')} · ${r.days}</div></div></div>
      ${nextTxt?`<div class="meta">${nextTxt}</div>`:''}<div class="meta" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${lastTxt}</div>${r.reason?`<div class="meta reason">${r.reason}</div>`:''}<div class="acts">${actsH}</div></div>`; };
  const sessions = `<div class="phone">${stat}<div class="hd"><h3>${x.pSessions}</h3></div><div class="cnt">
      <div class="prow flag"><span class="clock" style="color:var(--foreground)">${I.alarm(20)}</span><div style="flex:1"><b>${x.pEntry}</b><small>${x.pEntrySub(5, '13:30')}</small></div><span class="pill bad">2</span>${I.chev(16)}</div>
      ${['Iris|work|~/assistant','Otto|idle|~/Workspace/ledge','Lu|work|~/Workspace/ledge'].map(s=>{const [n,st,d]=s.split('|');return `<div class="prow">${bot(n==='Otto'?'#9ca3af':'#e8735a', st)}<div style="flex:1"><b>${n}</b> ${n!=='Lu'?`<span class="clock">${I.clock(13)}</span>`:''}<small>${d}</small></div></div>`;}).join('')}
    </div>${tabbar(1, 3)}</div>`;
  const list = `<div class="phone">${stat}<div class="hd"><span class="back">${I.back(16)}${x.pBack}</span></div><div class="hd" style="padding-top:0"><h3>${x.routines}</h3></div><div class="cnt">${pc(rs[0])}${pc(rs[1])}${pc(rs[2])}<div class="meta" style="font-size:12.5px;color:var(--muted-foreground);text-align:center">${x.pReadonly}</div></div>${tabbar(1, 3)}</div>`;
  const atoi = `<div class="phone">${stat}<div class="hd"><h3>${x.atoi}</h3></div><div class="cnt">
      <div class="pcard pending"><div class="top"><span class="pill ask">${x.pAsk}</span><span class="meta">${x.pRoutine} · 02:10</span></div><div style="display:flex;gap:9px;align-items:flex-start">${bot('#e8735a','idle')}<div>${L==='fr'?'<b>Iris</b> veut programmer « point-hebdo » : 17:00 (ven), dans ~/assistant':'<b>Iris</b> wants to schedule “point-hebdo”: 17:00 (Fri), in ~/assistant'}</div></div>
        <div class="unfold" style="margin:0;font-size:12px">${rs[0].prompt}</div><div class="acts"><button class="btn pri">${x.activate}</button><button class="btn">${x.refuse}</button></div><div class="meta" style="font-size:12px">${x.pVerify}</div></div>
      <div class="pcard failed"><div class="top"><span class="pill bad">${x.pFail}</span><span class="meta">${x.pRoutine} · 18:00</span></div><div style="display:flex;gap:9px;align-items:flex-start">${bot('#e8735a','off')}<div>${x.failLine('veille','Nova', x.failNoDir)}</div></div><div class="acts"><button class="btn pri">${x.retry}</button><button class="btn">${x.see}</button></div></div>
    </div>${tabbar(0, 3)}</div>`;
  return [{tag:'q', title:'Téléphone : l’entrée, la liste, « À toi »', wide:true,
    why:'<b>Entrée (proposition)</b> : une ligne « Routines » en tête de l’onglet Sessions (nombre, prochain tir, pastille rouge si une routine attend ou a échoué), qui ouvre l’écran Routines (« Retour aux sessions »). Pas de sixième onglet : la barre en a cinq. Autre choix possible : dans Réglages. <b>Liste</b> : lecture seule, une carte par routine, avec la mascotte de la session (le téléphone garde les mascottes) et son état, les heures et jours, prochain et dernier tir, puis <b>Lancer maintenant</b> et <b>Pause</b> / <b>Reprendre</b> en boutons de 40 px. Une routine en attente renvoie vers « À toi ». En pied, une phrase dit où créer ou modifier. Les sessions réveillées gardent l’horloge dans la liste des sessions. <b>« À toi »</b> : la demande d’activation, avec le prompt déplié (on le lit avant d’activer), Activer passe par la vérification de l’appareil (spec §3.1) ; l’échec avec Relancer / Voir.',
    keys:'mobile copy : routines.{entry,entrySub(n,next),title,back,readonly,next(t),runNow,retry,pause,resume,pending,seeInAtoi} · atoi.routine.{ask,failed,kind} (nouveaux, tutoiement)',
    scene: sessions + list + atoi}];
}

function tuiCard(){
  const x = t(), fr = L==='fr';
  const pad = (s, n) => s + ' '.repeat(Math.max(1, n - s.length));
  const keys = [['j k', x.tKeys.nav], ['r', x.tKeys.run], ['p', x.tKeys.pause], ['↵', x.tKeys.open], ['?', x.tKeys.help]].map(([k,v])=>`<span class="k">${k}</span> ${v}`).join('  ');
  const scr = (body, foot, toast='') => `<div class="tui"><div style="display:flex"><span><span class="acc">◖ ledge</span>  5 sessions · 1 machine</span><span style="flex:1"></span><span class="dim">7 · ${x.tTab}</span></div><div class="box"><span class="lg">${x.tTitle(5)}</span>${body}</div>${toast?toast+'\n':''}${foot}</div>`;
  const L1 = (sel, name, right, sub, cls='') => `<span class="${sel?'sel':''}" style="display:block">${cls?`<span class="${cls}">`:''}<b>${pad(name, 22)}</b>${cls?'</span>':''}${right}</span><span class="dim" style="display:block">  ${sub}</span>`;
  const body = [
    L1(false, 'point-hebdo', `<span class="warn">? ${x.tPending}</span>`, `Iris · 17:00 · ${x.fri}`),
    L1(false, 'veille', `<span class="bad">! 18:00 ${x.out.failed}</span>`, `Nova · 18:00 · ${x.daily} · ${x.failNoDir}`),
    L1(true,  'briefing', `<span class="ok">●</span> ${fr?'prochain':'next'} 13:30   <span class="ok">✓</span> 08:00 <span class="warn">${x.late}</span>`, `Iris · 08:00 13:30 16:30 · ${x.monfri} · ${x.out.resumed}`),
    L1(false, 'revue-prs', `<span class="ok">●</span> ${fr?'demain':'tomorrow'} 09:00  <span class="ok">✓</span> 09:00`, `Otto · 09:00 · ${x.monfri} · ${x.out.delivered}`),
    L1(false, 'nettoyage-branches', `<span class="dim">‖ ${x.paused}</span>`, `Pim · 19:30 · ${x.fri}`, 'dim'),
  ].join('');
  const foot = keys;
  const toast = `  <span class="ok">✓</span> ${x.tToast('briefing','Iris')}`;
  return {tag:'new', title:'ledge tui : l’écran Routines', wide:true,
    why:'Un écran de plus, avec les motifs de l’écran des rôles OpenRig : un cadre titré « ROUTINES · 5 », une ligne en gras par routine avec son état à droite, une sous-ligne grise (session, heures, jours, issue), la ligne choisie surlignée avec la barre corail à gauche. On y va par <span class="mono">7</span> (les écrans 1 à 6 existent) et il rejoint la liste des écrans de l’aide. <b>Touches</b> : <span class="mono">j k</span> naviguer, <span class="mono">r</span> lancer maintenant (Relancer si échouée), <span class="mono">p</span> pause / reprendre, <span class="mono">↵</span> ouvrir la session, <span class="mono">esc</span> retour. Le résultat s’affiche en toast sous le cadre, comme les autres. Une routine en attente se lit ici mais s’active dans « À toi » (spec : la TUI n’a que la liste, Lancer et Pause). Vide : « Aucune routine. `ledge routine add` en crée une. ». Sombre et clair suivent le thème de la TUI.',
    keys:'tui i18n : tabs.routines · routines.{title(n),pending,next,paused,late,empty,toast.*} · keys.{runNow,pauseResume,openSession} (nouveaux)',
    scene: scr(body, foot, toast)};
}

function fiche(){
  return `<section class="fiche"><h2>${L==='fr'?'Fiche de transmission (v2)':'Handoff sheet'} (dev-front, dev-back)</h2><table>
  <tr><th>Point</th><th>Règle</th></tr>
  <tr><td>Base</td><td>Le Desktop dessiné est l’IDE de <code>origin/main</code> à <code>756fd2a2</code> (barre d’activité, explorateur, onglets dockview, barre d’état, chat de droite avec Conversation / Tâches / Historique). Rien d’autre de l’IDE ne change.</td></tr>
  <tr><td>Structure (v2)</td><td>L’icône réveil de la barre d’activité (après « MR et PR ») est une <b>vue de barre latérale</b> (<code>SideView</code> « routines »), comme Projets, Rigs, « À toi », MR et PR. Un clic sur une ligne ouvre <b>un onglet par routine</b> (titre : son nom, icône réveil) ; « + » ouvre un onglet « Nouvelle routine ». Pastille rouge = routines en attente + dernier tir échoué. Palette : « Routines : afficher », « Routines : nouvelle routine ».</td></tr>
  <tr><td>Barre latérale</td><td>248 px. Ligne : marque (point d’état de la session, ou ? ! ‖), nom, prochain tir à droite (heure seule si aujourd’hui) ; dessous logo · session · heures · jours, coupé ; 3e ligne seulement pour « Attend ton accord », la raison d’un échec, « en retard ». Ordre : pending, failed, par <code>nextRun</code> (du daemon) ; groupe repliable « En pause » en bas. Survol : ▶ et ‖ à la place du prochain tir. Clic droit : Lancer maintenant, Pause, Ouvrir la session, Supprimer…. Ligne de l’onglet devant surlignée. Pied : le fuseau.</td></tr>
  <tr><td>Page</td><td>En-tête : nom, état (Active / En pause / Attend ton accord), Lancer maintenant (Relancer après un échec), Pause/Reprendre, ⋯ (Ouvrir la session, Supprimer…). « Réveille X (état) dans dossier ». Tirs : 3 prochains, derniers tirs (créneau, jour, issue, « en retard » + heure réelle, raison). Configuration : le formulaire de la v1, modifiable sur place ; barre collée « Modifications non enregistrées · Annuler les modifications · Enregistrer » (Ctrl+S) ; « • » devant le titre de l’onglet ; question à la fermeture.</td></tr>
  <tr><td>Bandeaux</td><td>En tête de page : ambre pour une demande (Activer / Refuser ; modifiable avant d’activer), ambre avec « avant → demandé » pour une modification par la session, rouge pour un échec (Relancer ; champ fautif entouré), rouge pour la suppression (Annuler focus / Supprimer ; Échap).</td></tr>
  <tr><td>Lancer maintenant</td><td>Sans confirmation ; « attend que X soit libre… » / « X redémarre… » sur la ligne et en tête de page ; toast ensuite (Voir = page de la routine).</td></tr>
  <tr><td>États</td><td>Vide (barre latérale : phrase + Nouvelle routine), connexion, daemon hors ligne (bandeau, liste estompée, boutons et Enregistrer désactivés).</td></tr>
  <tr><td>À toi</td><td>Page : bloc « Routines » après Décisions, caché quand vide ; deux lignes (demande : Voir le prompt, Activer, Refuser ; échec : Relancer, Voir). Barre latérale et île : les mêmes items en format court. Voir = la page de la routine.</td></tr>
  <tr><td>Le point</td><td>Groupes existants : En cours (« Iris briefing de 08:00 », sous-ligne « routine · depuis n min »), Terminé (heure), en retard (« …, lancé à 08:42 au réveil »), échec dans À toi avec Relancer. Textes dans <code>operator/point.ts</code> (L.fr / L.en).</td></tr>
  <tr><td>Horloge</td><td>Recommandé : icône horloge 12 px grise dans la ligne de session de l’explorateur (et dans la liste des sessions du téléphone), infobulle avec le prochain tir, clic = barre latérale sur Routines + page de la routine. Option barre d’état : à trancher.</td></tr>
  <tr><td>Téléphone</td><td>Entrée en tête de Sessions → écran Routines (lecture + Lancer maintenant + Pause/Reprendre). Activation dans « À toi », prompt déplié, vérification de l’appareil sur Activer.</td></tr>
  <tr><td>TUI</td><td>Écran 7 « Routines » ; <code>j k</code>, <code>r</code>, <code>p</code>, <code>↵</code>, <code>esc</code> ; toast sous le cadre ; pending en lecture seule.</td></tr>
  <tr><td>Textes</td><td>Desktop : vue Routines au tutoiement comme « À toi » (« Attend ton accord ») — voir question 6. Téléphone : tutoiement. TUI : « votre accord », comme ses états. Toutes les clés nouvelles sont sous chaque carte ; FR et EN dans ce fichier (bouton FR/EN).</td></tr>
  </table>
  <h2 style="margin-top:14px">${L==='fr'?'Questions pour jde (recommandation en premier)':'Questions for jde (recommendation first)'}</h2>
  <ol>
    <li><b>Petite horloge</b> (carte 12) : dans la ligne de session de l’explorateur seulement, un clic ouvre la routine (recommandé) ; ou aussi le prochain tir dans la barre d’état ; ou rien ?</li>
    <li><b>Téléphone</b> (carte 17) : l’entrée Routines en tête de l’onglet Sessions (recommandé), ou dans Réglages ? (La v2 du Desktop ne change pas le téléphone.)</li>
    <li><b>Modification demandée par une session</b> (carte 7) : la routine garde ses anciennes heures en attendant ta réponse (recommandé), ou elle s’arrête ? (Comportement du daemon, à reporter dans la spec.)</li>
    <li><b>TUI</b> : les deux nouveaux items de « À toi » aussi dans la vue d’ensemble de la TUI (recommandé), ou seulement l’écran Routines comme le demande la spec ?</li>

        <div class="island"><div class="ih"><b>Ledge</b><span>· ${x.atoi} · 1</span></div><div class="it"><div class="who"><span class="mk ask">?</span><b>Iris</b><span>· ${x.pRoutine.toLowerCase()} · 02:58</span></div><span>${L==='fr'?'Iris veut programmer 3 routines uniques : prépa-121 (3 déc. 16:00), prépa-comité-archi (7 déc. 15:00), prépa-démo-compart (8 déc. 09:30)':'Iris wants to schedule 3 one-shot routines: prépa-121 (3 Dec 16:00), prépa-comité-archi (7 Dec 15:00), prépa-démo-compart (8 Dec 09:30)'}</span><div class="acts"><button class="btn pri">${a.activateAll(3)}</button><button class="btn">${x.refuse}</button><button class="btn ghost">${x.see}</button></div></div></div>`; })()});

  C.push({tag:'add', title:'Une des uniques proposées : sa page et la barre latérale', wide:true,
    why:'Dans la barre latérale, les trois lignes restent groupées (carte « Barre latérale » ci-dessus). La page de l’une d’elles s’ouvre sur le bandeau ambre de la carte 6, adapté au groupe : « Iris propose 3 routines uniques ensemble (02:58) », les trois en liens (celle-ci en gras), puis <b>Activer les 3</b>, <b>Activer celle-ci</b>, <b>Refuser celle-ci</b>. Comme pour une demande seule, la configuration reste modifiable avant d’activer (choix 8 validé). Activer ou refuser ici met à jour l’item « À toi » (« Activer les 2 »…).',
    keys:'routines.groupBanner(who,n,at) · .groupBannerHint · .activateAll(n) · .activateThis · .refuseThis',
    scene: ide(`<div class="rp2"><div class="rhd">${I.alarm(18)}<h3>prépa-comité-archi</h3><span class="pill ask">${x.pending}</span><span style="flex:1"></span><button class="btn icon ghost">${I.dots(14)}</button></div>
      <div class="wakes">${x.wakes}${logo('claude',12)}<b>Iris</b><span class="dot work"></span><span class="mut">${x.st.working}</span><span class="mut">${x.inDir}</span><span class="mono">~/assistant</span></div>
      ${bannerBox('ask', a.groupBanner('Iris',3,'02:58'), `<span class="glinks"><a>prépa-121</a> · <a><b>prépa-comité-archi</b></a> · <a>prépa-démo-compart</a></span><br>${a.groupBannerHint}`, `<button class="btn pri">${a.activateAll(3)}</button><button class="btn">${a.activateThis}</button><button class="btn">${a.refuseThis}</button>`)}
      <section class="sect"><h4>${x.config}</h4><div class="form">${field(a.kind, kindSeg('once'))}${field(a.dates, `<div class="chips"><span class="chip">${d.mon7} · 15:00<span class="x">×</span></span><button class="btn ghost">${I.plus(12)}${a.addDate}</button></div>`)}${field('', prev3([[d.mon7,'15:00']]))}${field(x.fPrompt, `<div class="ta">Prépare le comité d’architecture du 8 déc. : ADR ouverts, changements du dépôt Archi, sujets à lever. Écris prepa/comite-archi-2026-12-08.md.</div>`)}</div></section></div>`,
      {side:rside3({sel:'prépa-comité-archi'}), tabs:[['Iris',''],['prépa-comité-archi','on']], rBadge:3, atoiBadge:3, tall:true})});

  C.push({tag:'add', title:'Téléphone, TUI, « Le point » : ce que l’ajout change', wide:true,
    why:'<b>Téléphone</b> : la liste se range en <b>Récurrentes</b> et <b>Uniques</b> (pas de Passées : l’historique se lit sur le PC) ; une récurrente à deux semaines dit « 1 semaine sur 2 » et son prochain tir porte la date ; une unique montre sa date. Dans « À toi », la proposition groupée est <b>une carte</b> avec ses lignes et <b>Activer les 3</b> / <b>Refuser les 3</b> (vérification de l’appareil sur Activer), le tri ligne par ligne restant sur le PC (question). <b>TUI</b> : un titre de groupe UNIQUES sous les récurrentes, « 1 sem./2 » et les dates dans les lignes ; rien d’autre. <b>« Le point »</b> : rien ne change, une unique y a la même ligne qu’une récurrente (« Iris prépa-121 de 16:00 »).',
    keys:'mobile : routines.groups.{recurring,once} · routines.everyOther · atoi.routine.groupAsk · activateAll/refuseAll · tui : routines.groupOnce · routines.every2',
    scene: (() => { const stat = `<div class="stat"><span>13:02</span><span>●●● 5G</span></div>`;
      const tabbar = (on) => `<div class="tabbar">${x.tabs.map((n,i)=>`<span class="${i===on?'on':''}"><i></i>${n}${i===0?`<em class="b">3</em>`:''}</span>`).join('')}</div>`;
      const card = (name, meta, next, btns) => `<div class="pcard"><div class="top">${bot('#e8735a','work')}<div style="flex:1;min-width:0"><b>${name}</b><div class="meta">${meta}</div></div></div><div class="meta">${next}</div>${btns?`<div class="acts">${btns}</div>`:''}</div>`;
      const runp = `<button class="btn">${I.play(14)}${x.runNow}</button><button class="btn">${x.pause}</button>`;
      const list = `<div class="phone">${stat}<div class="hd"><span class="back">${I.back(16)}${x.pBack}</span></div><div class="hd" style="padding-top:0"><h3>${x.routines}</h3></div><div class="cnt"><div class="cap" style="margin:4px 4px -4px">${a.groups.rec}</div>${card('bilan-sprint', `Iris · ${d.thu} 16:00 · ${a.phoneEvery}`, a.phoneNext(`${d.thu26} 16:00`), runp)}<div class="cap" style="margin:4px 4px -4px">${a.groups.once}</div>${card('rappel-conges', `Iris · ${a.oneShot}`, a.phoneNext(`${d.fri4} 09:00`), runp)}</div>${tabbar(1)}</div>`;
      const atoi = `<div class="phone">${stat}<div class="hd"><h3>${x.atoi}</h3></div><div class="cnt"><div class="pcard pending"><div class="top"><span class="pill ask">${x.pAsk}</span><span class="meta">${x.pRoutine} · 02:58</span></div><div style="display:flex;gap:9px;align-items:flex-start">${bot('#e8735a','work')}<div><b>Iris</b> ${a.groupAsk('',3).replace(/^ /,'')}</div></div>
        <div class="meta" style="display:flex;flex-direction:column;gap:4px;font-size:13px">${[['prépa-121',d.thu3,'16:00'],['prépa-comité-archi',d.mon7,'15:00'],['prépa-démo-compart',d.tue8,'09:30']].map(([n,dd,h])=>`<span><span style="color:var(--foreground)">${n}</span> · ${dd} ${h}</span>`).join('')}</div>
        <div class="acts"><button class="btn pri">${a.activateAll(3)}</button><button class="btn">${a.refuseAll(3)}</button></div><div class="meta" style="font-size:12px">${x.pVerify}</div></div></div>${tabbar(0)}</div>`;
      const pad = (s,n) => s + ' '.repeat(Math.max(1, n - s.length));
      const tl = (name, right, sub) => `<span style="display:block"><b>${pad(name,22)}</b>${right}</span><span class="dim" style="display:block">  ${sub}</span>`;
      const tui = `<div class="tui" style="width:600px"><div class="box" style="min-height:0"><span class="lg">${x.tTitle(8)}</span>${tl('briefing','<span class="ok">●</span> 13:30', `Iris · 08:00 13:30 16:30 · ${x.monfri}`)}${tl('bilan-sprint',`<span class="ok">●</span> ${d.short.thu26} 16:00`, `Iris · ${d.thu} 16:00 · ${L==='fr'?'1 sem./2':'every 2 wks'}`)}<span class="dim" style="display:block;margin-top:6px">${L==='fr'?'UNIQUES':'ONCE'}</span>${tl('prépa-121', `<span class="warn">? ${x.tPending}</span>`, `Iris · ${d.thu3} 16:00`)}${tl('rappel-conges', `<span class="ok">●</span> ${d.short.fri4} 09:00`, `Iris · ${a.oneShot}`)}</div></div>`;
      return list + atoi + tui; })()});

/* Précisions validées par jde le 2026-11-23 (qitem-20261123035235-5e47d4ad38c8f6be), after dev-front's questions on the point
   and the TUI: a) the point's activation row has « Voir » only, b) a routine run replaces « a terminé », c) the TUI's toasts and
   the old daemon, d) one group per machine; plus the TUI overview's « À toi » items (v2 question 4). */
function precCards(){
  const x = t(), fr = L==='fr', C = [];
  const P = fr ? {
    ask:'veut programmer « point-hebdo » : 17:00 (ven), dans ~/assistant', since:'routine · depuis 4 min', done:'routine · 13:52',
    notRunning:'Iris ne tourne pas : r lance la routine, qui la reprendra.', delivered:'« briefing » remise à Iris', resumed:'Iris reprise, « briefing » remise', launched:'Iris lancée, « briefing » remise',
    failed:'« veille » n’a pas pu partir : dossier introuvable : ~/veille', pauseRefused:'Pause refusée : &lt;raison&gt;', resumeRefused:'Reprise refusée : &lt;raison&gt;',
    old:'Ce daemon ne connaît pas encore les routines : mettez Ledge à jour.', m1:'PC du bureau', m2:'Portable',
    yours:'À toi · 3', a1:'Iris veut programmer « point-hebdo » : 17:00 (ven)', a2:'Iris veut programmer 3 routines uniques : 3, 7 et 8 déc.', a3:'La routine veille (Nova) n’a pas pu partir : dossier introuvable',
    kAct:'activer', kRef:'refuser', kRetry:'relancer', kActAll:'activer les 3', kRefAll:'refuser les 3',
  } : {
    ask:'wants to schedule “point-hebdo”: 17:00 (Fri), in ~/assistant', since:'routine · for 4 min', done:'routine · 13:52',
    notRunning:'Iris isn’t running: r runs the routine, which resumes it.', delivered:'“briefing” delivered to Iris', resumed:'Iris resumed, “briefing” delivered', launched:'Iris launched, “briefing” delivered',
    failed:'“veille” could not run: folder not found: ~/veille', pauseRefused:'Pause refused: &lt;reason&gt;', resumeRefused:'Resume refused: &lt;reason&gt;',
    old:'This daemon doesn’t know routines yet: update Ledge.', m1:'Office PC', m2:'Laptop',
    yours:'For you · 3', a1:'Iris wants to schedule “point-hebdo”: 17:00 (Fri)', a2:'Iris wants to schedule 3 one-shot routines: 3, 7 and 8 Dec', a3:'The routine veille (Nova) could not run: folder not found',
    kAct:'activate', kRef:'refuse', kRetry:'run again', kActAll:'activate all 3', kRefAll:'refuse all 3',
  };
  const pr = (dot, who, txt, sub, btns='') => `<div class="pr"><span class="dot ${dot}"></span><div><b>${who}</b> ${txt}${sub?`<small>${sub}</small>`:''}</div>${btns?`<div class="acts">${btns}</div>`:''}</div>`;
  C.push({tag:'add', title:'« Le point » : une demande d’activation, et la fin d’un tir (validé)', wide:false,
    why:'<b>a)</b> Une demande d’activation apparaît sous « À toi » du point avec son texte et <b>un seul bouton, Voir</b>, qui ouvre la page de la routine : pas d’Activer ni de Refuser dans le point (choix 7 : ils vivent sur la page, prompt sous les yeux, et dans « À toi »), pas de « Répondre ». <b>b)</b> Quand une session redevient libre à la fin d’un tir de routine, <b>la ligne de routine remplace « Iris a terminé »</b> sous « Terminé » : une seule ligne, avec l’heure de fin. Une fin sans tir en cours garde la ligne habituelle. Textes EN : « 13:30 briefing » (ptLine(nom, créneau)).',
    keys:'operator/point.ts : la ligne de demande reprend le texte de l’item « À toi » · nav « Voir » (pointCopy.nav) · aucune clé nouvelle',
    scene: `<div style="width:300px;background:var(--side);border:1px solid var(--border);border-radius:6px;padding:10px"><div class="pt"><div class="ph"><span class="m"></span><b>Ledge</b><span>${x.pointBy}</span><span style="flex:1"></span><span class="mono">13:55</span></div>
      <h5>${x.groups.atoi} <span class="mono">1</span></h5>${pr('ask','Iris', P.ask, '', `<button class="btn ghost">${x.ptSee}</button>`)}
      <h5>${x.groups.done} <span class="mono">1</span></h5>${pr('idle','Iris', x.ptLine('briefing','13:30'), P.done)}</div></div>`});
  const k = (key, label) => `<span class="k">${key}</span> ${label}`;
  const box = (title, body, extra='') => `<div class="box" style="min-height:0"><span class="lg">${title}</span>${body}</div>${extra}`;
  const pad = (s,n) => s + ' '.repeat(Math.max(1, n - s.length));
  const tl = (name, right, sub) => `<span style="display:block"><b>${pad(name,22)}</b>${right}</span><span class="dim" style="display:block">  ${sub}</span>`;
  const toasts = [[`<span class="ok">✓</span>`, P.delivered],[`<span class="ok">✓</span>`, P.resumed],[`<span class="ok">✓</span>`, P.launched],[`<span class="bad">!</span>`, P.failed],[`<span class="bad">!</span>`, P.pauseRefused],[`<span class="bad">!</span>`, P.resumeRefused],[`<span class="warn">·</span>`, P.notRunning]].map(([m,s])=>`  ${m} ${s}`).join('\n');
  C.push({tag:'add', title:'ledge tui : toasts, daemon ancien, plusieurs machines, « À toi » (validé)', wide:true,
    why:'<b>c)</b> Les toasts sous le cadre, dans les mots du Desktop : <code>r</code> remise, reprise ou lancée, ou son échec ; <code>p</code> refusé (« Pause refusée : … », « Reprise refusée : … ») ; <code>↵</code> sur une routine dont la session ne tourne pas : « Iris ne tourne pas : r lance la routine, qui la reprendra. ». Connexion et hors ligne : la barre d’état les dit, rien dans le cadre. Un <b>daemon trop ancien</b> n’affiche pas l’état vide (il mentirait) mais une phrase dans le cadre. <b>d)</b> Avec <b>plusieurs machines</b>, un titre de groupe par machine dans le cadre, comme les groupes de la vue d’ensemble ; UNIQUES se range dans chaque machine. Une machine seule : rien ne change. <b>Vue d’ensemble</b> (question 4 de la v2, validée) : les items « À toi » des routines y sont, avec <code>y</code> / <code>n</code> comme les demandes : activer / refuser, activer les N / refuser les N, relancer (pas de <code>n</code> pour un échec).',
    keys:'tui i18n : routines.toast.{delivered,resumed,launched,failed,notRunning} · routines.refused.{pause,resume}(why) · routines.oldDaemon · overview : routines.ask / groupAsk / failed · keys.{activate,refuse,retry,activateAll(n),refuseAll(n)}',
    scene: `<div class="tui" style="width:640px">${box(x.tTitle(5), tl('briefing',`<span class="ok">●</span> ${fr?'prochain':'next'} 13:30`, `Iris · 08:00 13:30 16:30 · ${x.monfri}`))}${toasts}</div>
      <div class="col" style="gap:14px"><div class="tui" style="width:560px">${box(x.tTitle(0), `<span class="warn" style="display:block;white-space:normal">${P.old}</span>`)}</div>
      <div class="tui" style="width:560px">${box(x.tTitle(4), `<span class="acc" style="display:block">${P.m1} ●</span>${tl('briefing',`<span class="ok">●</span> ${fr?'prochain':'next'} 13:30`, `Iris · ${x.monfri}`)}<span class="acc" style="display:block;margin-top:6px">${P.m2} ●</span>${tl('garde-mr',`<span class="ok">●</span> ${fr?'prochain':'next'} 15:00`, `Garde · ${x.monfri}`)}<span class="dim" style="display:block">  ${fr?'UNIQUES':'ONCE'}</span>${tl('rappel-conges',`<span class="ok">●</span> ${fr?'4 déc.':'4 Dec'} 09:00`, `Garde · ${fr?'unique':'once'}`)}`)}</div></div>
      <div class="tui" style="width:640px">${box(P.yours, `<span style="display:block"><span class="warn">?</span> ${P.a1}</span><span class="dim" style="display:block">  ${k('y',P.kAct)}  ${k('n',P.kRef)}</span><span style="display:block;margin-top:4px"><span class="warn">?</span> ${P.a2}</span><span class="dim" style="display:block">  ${k('y',P.kActAll)}  ${k('n',P.kRefAll)}</span><span style="display:block;margin-top:4px"><span class="bad">!</span> ${P.a3}</span><span class="dim" style="display:block">  ${k('y',P.kRetry)}</span>`)}</div>`});
  return C;
}

function render(){
  const x = t();
  document.getElementById('h1').textContent = x.h1;
  document.getElementById('hsub').textContent = x.hsub;
  const all = [...cards(), ...atoiCards(), pointCard(), ...phoneCards(), tuiCard(), ...addCards(), ...precCards()];
  document.getElementById('main').innerHTML = all.map((c,i)=>`<article class="card ${c.wide?'wide':''} ${c.tag==='add'?'addc':''}" id="s${i+1}"><h2><span class="n">${i+1}</span>${c.title}<span class="tag ${c.tag}">${c.tag==='add'?(L==='fr'?'ajout':'addition'):c.tag==='q'?(L==='fr'?'à trancher':'to decide'):(L==='fr'?'nouveau':'new')}</span></h2><div class="why">${c.why}</div><div class="keys">${c.keys && c.keys!=='—'?'<code>'+c.keys+'</code>':''}</div><div class="scene">${c.scene}</div></article>`).join('') + fiche();
}
function set(kind, v){
  if (kind==='theme') document.documentElement.dataset.theme = v; else { L = v; document.documentElement.lang = v; }
  document.querySelectorAll(`#${kind} button`).forEach(b => b.classList.toggle('on', b.dataset.v === v));
  render();
}
document.getElementById('theme').addEventListener('click', e => { if (e.target.dataset.v) set('theme', e.target.dataset.v); });
document.getElementById('lang').addEventListener('click', e => { if (e.target.dataset.v) set('lang', e.target.dataset.v); });
const q = new URLSearchParams(location.search);
set('theme', q.get('theme')==='light'?'light':'dark'); set('lang', q.get('lang')==='en'?'en':'fr');
</script>
