<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mes MR et PR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;650&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Issue kl-ledge/ledge#3 : toutes les MR et PR de l'utilisateur (créées, assignées, à relire), en liste avec un filtre.
   Base : docs/mockups/ledge-ide-prs-states.html (explorateur « MR et PR » de l'IDE, forge/PrsView.tsx) et la liste du téléphone
   (apps/mobile/src/screens/prs/PrsList.tsx). Tokens : packages/ui tokens.css. */
:root[data-theme="dark"]{
  color-scheme:dark;
  --foreground:oklch(0.985 0 0);--card:oklch(0.205 0 0);--muted:oklch(0.269 0 0);--muted-foreground:oklch(0.708 0 0);
  --primary:oklch(0.444 0.177 26.899);--border:#ffffff1a;--input:#ffffff26;
  --shell:#0d0d0d;--side:#141414;--pane:#111112;--page:#000;--hover:#ffffff10;--note:#a78bfa;
  --ok:#34d399;--fail:#f87171;--run:#60a5fa;--wait:#fbbf24;--off:#71717a;--coral:#ea6a58;
}
:root[data-theme="light"]{
  color-scheme:light;
  --foreground:oklch(0.145 0 0);--card:oklch(1 0 0);--muted:oklch(0.97 0 0);--muted-foreground:oklch(0.556 0 0);
  --primary:oklch(0.505 0.213 27.518);--border:oklch(0.922 0 0);--input:oklch(0.922 0 0);
  --shell:oklch(0.985 0 0);--side:oklch(0.975 0 0);--pane:#fff;--page:oklch(0.95 0 0);--hover:#0000000a;--note:#7c3aed;
  --ok:#059669;--fail:#dc2626;--run:#2563eb;--wait:#b45309;--off:#a1a1aa;--coral:#cc5241;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Geist','Segoe UI',system-ui,sans-serif;background:var(--page);color:var(--foreground);font-size:13px;line-height:18px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
code,.mono{font-family:'Geist Mono',ui-monospace,Consolas,monospace;font-size:11px}
header.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;background:var(--shell);border-bottom:1px solid var(--border)}
header.bar h1{font-size:14px;font-weight:600;margin:0}
header.bar .sub{color:var(--muted-foreground);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--input);border-radius:7px;overflow:hidden}
.seg button{padding:3px 10px;font-size:12px;color:var(--muted-foreground)}
.seg button.on{background:var(--muted);color:var(--foreground)}
main{padding:20px;display:flex;flex-direction:column;gap:18px;max-width:1240px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.card>h2{font-size:12.5px;font-weight:600;margin:0;padding:10px 14px 0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card>h2 .n{font-family:'Geist Mono',monospace;font-size:11px;color:var(--muted-foreground)}
.card .why{padding:4px 14px 8px;color:var(--muted-foreground);font-size:12px}
.card .why b{color:var(--foreground);font-weight:500}
.card .keys{padding:0 14px 10px;font-size:11px;color:var(--muted-foreground)}
.tag{font-size:10.5px;border-radius:8px;padding:0 6px;border:1px solid}
.tag.new{color:var(--note);border-color:color-mix(in srgb,var(--note) 45%,transparent)}
.scene{border-top:1px solid var(--border);background:var(--page);padding:16px;display:flex;gap:18px;align-items:flex-start;justify-content:center;flex-wrap:wrap;overflow-x:auto}
.cap{font-size:11px;color:var(--muted-foreground);text-align:center;margin-top:6px;max-width:320px}
.pd{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block;background:var(--off)}
.pd.ok{background:var(--ok)}.pd.fail{background:var(--fail)}.pd.run{background:var(--run)}.pd.wait{background:var(--wait)}.pd.none{background:none;border:1.5px solid var(--off);width:8px;height:8px}
/* L'explorateur « MR et PR » (fg-side), 280 px. */
.side{width:290px;height:660px;background:var(--side);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.side.short{height:470px}
.sh{display:flex;align-items:baseline;gap:8px;padding:9px 10px 5px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);font-weight:500}
.sh small{margin-left:auto;letter-spacing:0;text-transform:none;font-size:10.5px}
.flt{display:flex;flex-direction:column;gap:6px;padding:2px 8px 8px;border-bottom:1px solid var(--border)}
.search{height:26px;border:1px solid var(--input);border-radius:6px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--pane);font-size:12px;color:var(--muted-foreground)}
.search.typed{color:var(--foreground);border-color:var(--muted-foreground)}
.search .x{margin-left:auto;color:var(--muted-foreground)}
.roles{display:flex;flex-wrap:wrap;gap:4px}
.role{height:22px;border:1px solid var(--input);border-radius:11px;padding:0 8px;font-size:11.5px;display:inline-flex;align-items:center;gap:5px;color:var(--muted-foreground)}
.role .c{font-family:'Geist Mono',monospace;font-size:10.5px}
.role.on{background:var(--muted);color:var(--foreground);border-color:transparent}
.role.rev .c{color:var(--wait)}
.tree{display:flex;flex-direction:column;padding:4px 4px;overflow:hidden}
.row{display:flex;gap:8px;align-items:flex-start;padding:6px 6px;border-radius:6px;text-align:left}
.row.on{background:var(--hover);box-shadow:inset 2px 0 0 var(--coral)}
.row .pd{margin-top:5px}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:12px}
.row .t .l1{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .t b{font-weight:600;font-family:'Geist Mono',monospace;font-size:11px;margin-right:4px}
.row .t small{font-size:11px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small i{font-style:normal;color:var(--foreground)}
.rl{display:flex;gap:4px;flex-wrap:wrap}
.rp{font-size:10px;line-height:14px;border:1px solid var(--input);border-radius:7px;padding:0 5px;color:var(--muted-foreground)}
.rp.rev{color:var(--wait);border-color:color-mix(in srgb,var(--wait) 50%,transparent)}
.rp.trk{color:var(--note);border-color:color-mix(in srgb,var(--note) 45%,transparent)}
.dim{opacity:.6}
.fold{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:11.5px;color:var(--muted-foreground);border-top:1px solid var(--border)}
.foot{margin-top:auto;padding:8px 10px;font-size:11px;color:var(--muted-foreground);border-top:1px solid var(--border)}
.empty{padding:22px 14px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;font-size:12px;color:var(--muted-foreground)}
.empty b{color:var(--foreground);font-weight:500}
.btn{height:24px;padding:0 9px;border-radius:6px;border:1px solid var(--input);font-size:11.5px;display:inline-flex;align-items:center;gap:6px;background:var(--pane)}
/* Le téléphone. */
.phone{width:330px;height:660px;border-radius:30px;border:1px solid var(--border);background:var(--pane);padding:14px 12px 10px;display:flex;flex-direction:column;gap:10px;overflow:hidden;flex-shrink:0}
.phone .top{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600}
.phone .top small{margin-left:auto;font-size:11px;color:var(--muted-foreground);font-weight:400}
.phone .search{height:36px;border-radius:9px;font-size:13px}
.phone .roles{flex-wrap:nowrap;overflow:hidden}
.phone .role{height:30px;border-radius:15px;padding:0 11px;font-size:12.5px;flex-shrink:0}
.phone .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);display:flex}
.phone .lbl small{margin-left:auto;letter-spacing:0;text-transform:none}
.frame{border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.prow{display:flex;gap:9px;padding:9px 11px;border-bottom:1px solid var(--border);font-size:13px}
.prow:last-child{border-bottom:0}
.prow .pd{margin-top:6px}
.prow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.prow .t b{font-family:'Geist Mono',monospace;font-size:12px;font-weight:600;margin-right:4px}
.prow small{font-size:11.5px;color:var(--muted-foreground)}
.chip{font-size:10.5px;border-radius:7px;padding:0 6px;border:1px solid var(--input);color:var(--muted-foreground)}
.chip.att{color:var(--wait);border-color:color-mix(in srgb,var(--wait) 50%,transparent)}
.chip.okc{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.tabs{margin-top:auto;display:flex;justify-content:space-around;font-size:11px;color:var(--muted-foreground);border-top:1px solid var(--border);padding-top:8px}
.tabs .on{color:var(--foreground);font-weight:500}
.opts{width:520px;display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--border);border-radius:9px;background:var(--pane);padding:9px 12px;font-size:12px}
.opt b{font-weight:600}
.opt.reco{border-color:color-mix(in srgb,var(--note) 55%,var(--border))}
.opt p{margin:3px 0 0;color:var(--muted-foreground)}
section.fiche{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;font-size:12.5px}
section.fiche h2{font-size:13px;margin:0 0 6px}
section.fiche table{border-collapse:collapse;width:100%;font-size:12px}
section.fiche td,section.fiche th{border-top:1px solid var(--border);padding:5px 8px;text-align:left;vertical-align:top}
section.fiche th{color:var(--muted-foreground);font-weight:500}
section.fiche ol{margin:6px 0 0;padding-left:20px}section.fiche li{margin:6px 0}
@media (max-width:640px){main{padding:12px}.scene{justify-content:flex-start}}
</style>
</head>
<body>
<header class="bar">
  <h1 id="h1"></h1><span class="sub" id="hsub"></span><span style="flex:1"></span>
  <span class="seg" id="theme"><button data-v="dark">Sombre</button><button data-v="light">Clair</button></span>
  <span class="seg" id="lang"><button data-v="fr">FR</button><button data-v="en">EN</button></span>
</header>
<main id="main"></main>
<script>
const T = {
  fr: {
    h1:'MR et PR — toutes les miennes, avec un filtre', hsub:'Issue kl-ledge/ledge#3, base ledge-ide-prs-states.html. À valider par l’utilisateur.',
    view:'MR et PR', hosts:'GitHub · GitLab', search:'Chercher : réf, titre, dépôt', all:'Toutes', created:'Créées', assigned:'Assignées', review:'À relire',
    pill:{created:'créée', assigned:'assignée', review:'à relire', tracked:'branche suivie'},
    state:{draft:'brouillon', open:'ouverte', review:'en revue', merged:'fusionnée', closed:'fermée'},
    pipe:{ok:'réussi', run:'en cours', fail:'échoué', wait:'en attente', none:'aucun'},
    closed:(n,d)=>`Fusionnées et fermées · ${n} · ${d} derniers jours`,
    foot:'Les MR et PR que tu as créées, qui te sont assignées ou que tu dois relire, sur chaque forge connectée (gh, glab). Clic : la MR ou PR dans un onglet.',
    none:'Aucune MR ou PR ne correspond.', clear:'Effacer le filtre', noneRole:{review:'Rien à relire pour l’instant.'},
    phoneTitle:'MR et PR', openHead:n=>`Ouvertes · ${n}`, asOf:'relevé 14:02', closedGroup:n=>`Fusionnées et fermées (${n})`, threads:n=>`${n} fil${n>1?'s':''}`, ready:'prête',
    tabs:['À toi','Sessions','MR/PR','Rigs','Ledge'],
  },
  en: {
    h1:'MRs and PRs — all of mine, with a filter', hsub:'Issue kl-ledge/ledge#3, base ledge-ide-prs-states.html. For the user to validate.',
    view:'MRs and PRs', hosts:'GitHub · GitLab', search:'Search: ref, title, repository', all:'All', created:'Created', assigned:'Assigned', review:'To review',
    pill:{created:'created', assigned:'assigned', review:'to review', tracked:'tracked branch'},
    state:{draft:'draft', open:'open', review:'in review', merged:'merged', closed:'closed'},
    pipe:{ok:'passed', run:'running', fail:'failed', wait:'pending', none:'none'},
    closed:(n,d)=>`Merged and closed · ${n} · last ${d} days`,
    foot:'The MRs and PRs you created, are assigned or must review, on every connected forge (gh, glab). Click: the MR or PR in a tab.',
    none:'No MR or PR matches.', clear:'Clear the filter', noneRole:{review:'Nothing to review for now.'},
    phoneTitle:'MRs and PRs', openHead:n=>`Open · ${n}`, asOf:'read 14:02', closedGroup:n=>`Merged and closed (${n})`, threads:n=>`${n} thread${n>1?'s':''}`, ready:'ready',
    tabs:['For you','Sessions','MR/PR','Rigs','Ledge'],
  }
};
let L = 'fr';
const t = () => T[L];
const svg = (d, s=12) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d.map(p=>`<path d="${p}"/>`).join('')}</svg>`;
const I = { search:['M10.5 3a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15','m16 16 5 5'], x:['M6 6l12 12','M18 6 6 18'], chev:['m9 6 6 6-6 6'] };
// The user's requests: forge, ref, title, repository, state, pipeline, roles, agent (tracked branch), threads.
const PRS = [
  {f:'github', ref:'#231', title:'Lot 9 : fenêtres détachées', repo:'ledge', st:'review', p:'ok', roles:['created'], agent:'Otto', th:2},
  {f:'github', ref:'#88', title:'Rendu des polices variables dans le PDF', repo:'paper-rendering', st:'review', p:'fail', roles:['review'], agent:null, th:5},
  {f:'gitlab', ref:'!141', title:'Worker : relance sur délai S3', repo:'synapse', st:'open', p:'run', roles:['created','assigned'], agent:'Tom', th:0},
  {f:'github', ref:'#12', title:'Clé de mise à jour : nouvelle paire', repo:'kl-ledge/ledge', st:'review', p:'ok', roles:['review','assigned'], agent:null, th:1},
  {f:'gitlab', ref:'!77', title:'Refus d’un IBAN vide', repo:'speos-front', st:'draft', p:'wait', roles:['created'], agent:'Pim', th:0},
  {f:'github', ref:'#90', title:'Mise à jour de pdf-lib 1.17', repo:'paper-rendering', st:'open', p:'none', roles:['review'], agent:null, th:0},
  {f:'github', ref:'#229', title:'Lot 6 : onglets Réglages et Atelier', repo:'ledge', st:'open', p:'ok', roles:['assigned'], agent:null, th:0},
];
const CLOSED = [
  {f:'github', ref:'#228', title:'Lot 5 : groupes liés', repo:'ledge', st:'merged', p:'ok', roles:['created'], agent:'Iris', th:0},
  {f:'gitlab', ref:'!139', title:'Cache des modèles', repo:'synapse', st:'closed', p:'fail', roles:['review'], agent:null, th:0},
];
const host = f => f==='github'?'GitHub':'GitLab';
const pills = (x) => `<span class="rl">${x.roles.map(r=>`<span class="rp ${r==='review'?'rev':''}">${t().pill[r]}</span>`).join('')}${x.agent?`<span class="rp trk">${t().pill.tracked}</span>`:''}</span>`;
const meta = x => [host(x.f), x.repo, t().state[x.st], ...(x.agent?[`<i>${x.agent}</i>`]:[]), `pipeline ${t().pipe[x.p]}`, ...(x.th?[`${x.th} comm.`]:[])].join(' · ');
const row = (x, o={}) => `<div class="row ${o.on?'on':''} ${o.dim?'dim':''}"><span class="pd ${x.p}"></span><span class="t"><span class="l1"><b>${x.ref}</b>${x.title}</span>${pills(x)}<small>${meta(x)}</small></span></div>`;
const count = r => r==='all' ? PRS.length : PRS.filter(x=>x.roles.includes(r)).length;
const roles = (on) => `<div class="roles">${['all','created','assigned','review'].map(r=>`<span class="role ${on===r?'on':''} ${r==='review'?'rev':''}">${t()[r]}<span class="c">${count(r)}</span></span>`).join('')}</div>`;
const side = (o={}) => {
  const x = t();
  const role = o.role||'all';
  let list = PRS.filter(p=>role==='all'||p.roles.includes(role));
  if (o.q) list = list.filter(p=>(p.ref+p.title+p.repo).toLowerCase().includes(o.q.toLowerCase()));
  const body = list.length ? `<div class="tree">${list.map((p,i)=>row(p,{on:i===0&&o.cur})).join('')}</div>` : `<div class="empty"><b>${x.none}</b><button class="btn">${x.clear}</button></div>`;
  const closed = o.closed===false ? '' : `<div class="fold">${svg(o.unfold?['m6 9 6 6 6-6']:I.chev)}${x.closed(CLOSED.length, 7)}</div>${o.unfold?`<div class="tree">${CLOSED.map(p=>row(p,{dim:true})).join('')}</div>`:''}`;
  return `<div class="side ${o.cls||''}"><div class="sh">${x.view}<small>${x.hosts}</small></div><div class="flt"><div class="search ${o.q?'typed':''}">${svg(I.search)}${o.q||x.search}${o.q?`<span class="x">${svg(I.x)}</span>`:''}</div>${roles(role)}</div>${body}${closed}<div class="foot">${x.foot}</div></div>`;
};
const phone = (o={}) => {
  const x = t();
  const role = o.role||'all';
  const all = PRS.filter(p=>role==='all'||p.roles.includes(role)); const list = all.slice(0,5);
  const prow = p => `<div class="prow"><span class="pd ${p.p}"></span><span class="t"><span><b>${p.ref}</b>${p.title}</span>${pills(p)}<small>${[host(p.f), p.repo, ...(p.agent?[p.agent]:[]), x.state[p.st]].join(' · ')}</small>${p.th||p.p==='ok'?`<span class="rl">${p.th?`<span class="chip att">${x.threads(p.th)}</span>`:''}${p.p==='ok'&&p.st==='review'?`<span class="chip okc">${x.ready}</span>`:''}</span>`:''}</span></div>`;
  return `<div class="phone"><div class="top">${x.phoneTitle}<small>● PC</small></div><div class="search ${o.q?'typed':''}">${svg(I.search,14)}${o.q||x.search}</div>${roles(role)}<div class="lbl">${x.openHead(all.length)}<small>${x.asOf}</small></div><div class="frame">${list.map(prow).join('')}</div><div class="frame"><div class="prow" style="color:var(--muted-foreground)">${svg(I.chev,14)}${x.closedGroup(CLOSED.length)}</div></div><div class="tabs">${x.tabs.map((n,i)=>`<span class="${i===2?'on':''}">${n}</span>`).join('')}</div></div>`;
};

function cards(){
  const x = t(), C = [], F = L==='fr';
  C.push({title:F?'Desktop : toutes mes MR et PR, un filtre par rôle et une recherche':'Desktop: all my MRs and PRs, a role filter and a search',
    why:`L’explorateur « MR et PR » liste désormais <b>toutes les MR et PR de l’utilisateur</b>, sur chaque forge connectée, quel que soit le dépôt. En tête : une <b>recherche</b> (réf, titre, dépôt) et quatre <b>rôles</b> avec leur nombre, <b>Toutes · Créées · Assignées · À relire</b> (« À relire » a son chiffre en ambre : c’est ce qui attend l’utilisateur). Chaque ligne garde sa pastille de pipeline, sa réf et son titre, puis ses <b>rôles en pastilles</b> (plusieurs si besoin : « créée » + « assignée »), et la ligne de détail existante. Une PR d’une <b>branche suivie</b> garde son agent (en clair dans la ligne) et prend la pastille « branche suivie ». Une même MR ou PR vue par deux machines ou à deux titres n’a qu’une ligne. Les fusionnées et fermées sont repliées en bas (carte 4).`,
    keys:F?'Nouveaux : forge.search, .roles.{all,created,assigned,review}, .pill.{created,assigned,review,tracked}, .closedFor(n,d), forge.foot (réécrit)':'New: forge.search, .roles.{all,created,assigned,review}, .pill.{created,assigned,review,tracked}, .closedFor(n,d), forge.foot (rewritten)',
    scene: `<div>${side({cur:true})}<div class="cap">${F?'Toutes':'All'}</div></div><div>${side({role:'review', closed:false, cls:''})}<div class="cap">${F?'À relire : 3, les deux autres rôles restent sur les lignes':'To review: 3, other roles stay on the rows'}</div></div>`});
  C.push({title:F?'Recherche, et rien qui correspond':'Search, and nothing matching',
    why:`La recherche filtre <b>à la frappe</b>, dans le rôle choisi, sur la réf (« #88 », « !141 »), le titre et le dépôt ; × l’efface. Les chiffres des rôles ne changent pas (ils comptent tout, pour qu’on sache où chercher). Rien ne correspond : une phrase et <b>Effacer le filtre</b> (remet « Toutes » et vide la recherche). Le filtre et la recherche sont gardés tant que la fenêtre vit.`,
    keys:F?'Nouveaux : forge.none, forge.clear':'New: forge.none, forge.clear',
    scene: `<div>${side({q:'paper', closed:false, cls:'short'})}<div class="cap">« paper »</div></div><div>${side({q:'!999', closed:false, cls:'short'})}<div class="cap">${F?'Rien ne correspond':'Nothing matches'}</div></div>`});
  C.push({title:F?'Téléphone : la même liste, le même filtre':'Phone: the same list, the same filter',
    why:`L’onglet MR/PR du téléphone reçoit les mêmes MR et PR et le même filtre : la recherche puis les rôles en pastilles (qui défilent de côté si l’écran est étroit). Chaque ligne garde ce qu’elle montre aujourd’hui (pipeline, forge · dépôt · agent · état, fils ouverts, « prête ») et prend les pastilles de rôle. Les fusionnées et fermées restent repliées en bas.`,
    keys:F?'Mobile : prs.search, prs.roles.*, prs.pill.* (nouveaux, mêmes mots que Desktop)':'Mobile: prs.search, prs.roles.*, prs.pill.* (new, same words as Desktop)',
    scene: `<div>${phone({})}<div class="cap">${F?'Toutes':'All'}</div></div><div>${phone({role:'review'})}<div class="cap">${F?'À relire':'To review'}</div></div>`});
  C.push({title:F?'Fusionnées et fermées : combien de temps on les garde':'Merged and closed: how long they stay',
    why:`Aujourd’hui seules les fusionnées des branches suivies s’affichent. Avec toutes les MR et PR de l’utilisateur, la liste grandirait sans fin : il faut une limite. Elles restent <b>repliées</b> en bas, avec leur nombre et la durée ; un clic les déplie (estompées). Le filtre et la recherche s’y appliquent aussi.`,
    keys:F?'Nouveau : forge.closedFor(n, jours)':'New: forge.closedFor(n, days)',
    scene: `<div>${side({unfold:true, closed:true, cls:'short', role:'created'})}<div class="cap">${F?'Dépliées : estompées, sous les ouvertes':'Unfolded: dimmed, under the open ones'}</div></div>
      <div class="opts"><div class="opt reco"><b>A · ${F?'7 jours (recommandé)':'7 days (recommended)'}</b><p>${F?'Une semaine couvre « ce qui vient de partir » sans encombrer. Au-delà, la forge les garde (« Ouvrir sur GitHub »).':'A week covers “what just left” without clutter. Beyond that, the forge keeps them (“Open on GitHub”).'}</p></div>
      <div class="opt"><b>B · ${F?'7 jours, ou les 20 dernières si c’est moins':'7 days, or the last 20 if fewer'}</b><p>${F?'Évite une liste trop longue après une grosse semaine de fusions.':'Avoids an overlong list after a heavy week of merges.'}</p></div>
      <div class="opt"><b>C · ${F?'Jusqu’au lendemain':'Until the next day'}</b><p>${F?'Liste la plus courte, mais une PR fusionnée vendredi a disparu lundi.':'Shortest list, but a PR merged on Friday is gone by Monday.'}</p></div>
      <div class="opt"><b>D · ${F?'Réglable (1, 7, 30 jours) dans Réglages':'Adjustable (1, 7, 30 days) in Settings'}</b><p>${F?'Un réglage de plus, pour un besoin pas encore exprimé.':'One more setting, for a need not yet expressed.'}</p></div></div>`});
  return C;
}

function fiche(){
  return `<section class="fiche"><h2>Fiche de transmission (dev-back, dev-front)</h2><table>
  <tr><th>Point</th><th>Règle</th></tr>
  <tr><td>Lecture</td><td>Par forge connectée et par machine : GitHub <code>author:@me</code>, <code>assignee:@me</code>, <code>review-requested:@me</code> ; GitLab <code>scope=created_by_me</code>, <code>scope=assigned_to_me</code>, <code>reviewer_username=&lt;moi&gt;</code>. En plus des branches suivies (agent, pipeline). Fusion par forge + hôte + dépôt + réf : une ligne, rôles réunis.</td></tr>
  <tr><td>Protocole</td><td><code>PullRequest.roles: ('created'|'assigned'|'review')[]</code> dans <code>@ledge/protocol</code> ; <code>sessions</code> non vide = branche suivie.</td></tr>
  <tr><td>Pipeline</td><td>Montré pour toutes les lignes si la forge le donne ; sinon la pastille creuse « aucun ». À confirmer par dev-back (la recherche GitHub ne rend pas les checks ; il faut une lecture par PR, à borner).</td></tr>
  <tr><td>Filtre</td><td>Recherche + rôle, gardés pour la vie de la fenêtre (Desktop) / de l’onglet (téléphone). Les chiffres comptent les ouvertes, sans la recherche. Tri : plus récente modifiée d’abord, comme aujourd’hui.</td></tr>
  <tr><td>Fermées</td><td>Repliées en bas, durée selon la question 1 ; filtre et recherche appliqués.</td></tr>
  <tr><td>Pied</td><td>Réécrit : « Les MR et PR que tu as créées, qui te sont assignées ou que tu dois relire, sur chaque forge connectée (gh, glab). Clic : la MR ou PR dans un onglet. »</td></tr>
  <tr><td>Textes</td><td>Nouveaux (FR · EN) : Chercher : réf, titre, dépôt · Search: ref, title, repository ; Toutes / Créées / Assignées / À relire · All / Created / Assigned / To review ; créée / assignée / à relire / branche suivie · created / assigned / to review / tracked branch ; Fusionnées et fermées · {n} · {d} derniers jours ; Aucune MR ou PR ne correspond. ; Effacer le filtre ; le pied. Repris : états, pipeline, ligne de détail, « Fusionnées et fermées (n) » du téléphone.</td></tr>
  </table>
  <h2 style="margin-top:14px">Questions pour l’utilisateur (recommandation en premier)</h2>
  <ol>
    <li><b>Durée des fusionnées et fermées</b> (carte 4) : A) 7 jours (recommandé) ; B) 7 jours ou les 20 dernières ; C) jusqu’au lendemain ; D) réglable.</li>
    <li><b>Le filtre à l’ouverture</b> : A) « Toutes » (recommandé : rien n’est caché) ; B) « À relire » s’il y en a, sinon « Toutes ».</li>
    <li><b>Les chiffres des rôles</b> : A) ils comptent tout, sans la recherche (recommandé : on voit où chercher) ; B) ils suivent la recherche.</li>
    <li><b>Le badge de la barre d’activité</b> (aujourd’hui : pipelines échoués) : A) inchangé (recommandé) ; B) il ajoute le nombre « À relire ».</li>
    <li><b>Les textes nouveaux</b> (fiche) : d’accord ? Le pied passe au tutoiement, comme « À toi ».</li>
  </ol></section>`;
}

function render(){
  const x = t();
  document.getElementById('h1').textContent = x.h1;
  document.getElementById('hsub').textContent = x.hsub;
  document.getElementById('main').innerHTML = cards().map((c,i)=>`<article class="card" id="s${i+1}"><h2><span class="n">${i+1}</span>${c.title}<span class="tag new">${L==='fr'?'nouveau':'new'}</span></h2><div class="why">${c.why}</div><div class="keys">${c.keys!=='—'?'<code>'+c.keys+'</code>':''}</div><div class="scene">${c.scene}</div></article>`).join('') + fiche();
}
function set(kind, v){
  if (kind==='theme') document.documentElement.dataset.theme = v; else { L = v; document.documentElement.lang = v; }
  document.querySelectorAll(`#${kind} button`).forEach(b => b.classList.toggle('on', b.dataset.v === v));
  render();
}
document.getElementById('theme').addEventListener('click', e => { if (e.target.dataset.v) set('theme', e.target.dataset.v); });
document.getElementById('lang').addEventListener('click', e => { if (e.target.dataset.v) set('lang', e.target.dataset.v); });
const qs = new URLSearchParams(location.search);
set('theme', qs.get('theme')==='light'?'light':'dark'); set('lang', qs.get('lang')==='en'?'en':'fr');
</script>
